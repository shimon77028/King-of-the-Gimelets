 setTimeout(()=>{if(gaveUp)return;tableClose();SCR='home';home();
  const bg=sheet(`<h2>${score>1000?'סיימת ברווח! 🤑':score>0?'סיימת את הטורניר':'נשרפת... 💀'}</h2><div class="neon" style="font-size:70px">${fmt(score)}</div><p>${reward?`קיבלת ${fmt(reward)} צ׳יפים לקופה האמיתית (רבע מהרווח). `:''}השיא שלך היום: <b>${fmt(best)}</b></p>
   <div id="trank"><p>שולח לטבלה... 📡</p></div><button class="btn" data-x="board" type="button">🏆 לטבלת היום</button><button class="btn alt" data-x="close" type="button">לתפריט</button>`,x=>{if(x==='board')boardScr('tour')});
  if(score>1000){SFX.big();confetti(document.body,50)}
  sbRpc('bj21_tour_submit',{p_id:P.id,p_name:P.name,p_score:score}).then(r=>{const e=$('#trank',bg);if(e&&r)e.innerHTML=`<p style="font-size:18px">אתה במקום <b style="color:var(--gold)">${r.rank}</b> מתוך ${fmt(r.count)} היום!</p>`}).catch(()=>{const e=$('#trank',bg);if(e)e.innerHTML='<p>לא הצלחנו לשלוח לטבלה.</p>'})},1500)}
/* ---------- online rooms ---------- */
let NET=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function sbClient(){if(window.__sbc)return window.__sbc;if(!window.supabase)await loadScript(SBJS);window.__sbc=window.supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:false},realtime:{params:{eventsPerSecond:40}}});return window.__sbc}
async function transport(code){let local=false;try{local=localStorage.getItem('bj21_local')==='1'}catch(e){}
 const X={h:[],on:f=>X.h.push(f),emit:m=>X.h.forEach(f=>f(m))};
 if(local){const bc=new BroadcastChannel('bj21-'+code);bc.onmessage=e=>X.emit(e.data);X.send=m=>bc.postMessage(m);X.leave=()=>bc.close();return X}
 const sb=await sbClient(),ch=sb.channel('bj21-room-'+code,{config:{broadcast:{self:false,ack:false}}});ch.on('broadcast',{event:'m'},({payload})=>X.emit(payload));
 await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('timeout')),12000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(to);res()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(to);rej(new Error(st))}})});
 X.send=m=>ch.send({type:'broadcast',event:'m',payload:m});X.leave=()=>{try{sb.removeChannel(ch)}catch(e){}};return X}
const roomCode=()=>Array.from({length:5},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
function netSend(m){if(NET&&NET.X){m.from=P.id;try{NET.X.send(m)}catch(e){}}}
function netLeave(){if(!NET)return;clearInterval(NET.hb);try{NET.X&&NET.X.leave()}catch(e){}NET=null}
function friendsScr(){if(!P.name){nameScr();return}
 sheet(`<h2>👥 שולחן עם חברים</h2><p>עד 4 שחקנים מול הדילר, בזמן אמת. כל אחד מקבל 1,000 צ׳יפים לשולחן.</p>
  <button class="btn green" data-x="coop" type="button">🤝 ביחד מול הבית<small style="display:block;font-size:12px;opacity:.9">משחק חופשי, נכנסים ויוצאים מתי שרוצים</small></button>
  <button class="btn" data-x="comp" type="button">⚔️ תחרות · 10 ידיים<small style="display:block;font-size:12px;opacity:.9">מי שגומר עם הכי הרבה צ׳יפים לוקח 500 אמיתיים</small></button>
  <p>יש לך קוד?</p><input class="inp" id="codeI" maxlength="5" placeholder="קוד חדר" style="direction:ltr;letter-spacing:.2em"><button class="btn blue" data-x="join" type="button">הצטרף</button>
  <button class="btn alt" data-x="close" type="button">חזרה</button>`,(x,b,bg)=>{if(x==='coop'||x==='comp')roomHost(x==='coop');if(x==='join'){const c=$('#codeI',bg).value.trim().toLowerCase();if(/^[a-z0-9]{5}$/.test(c))roomJoin(c);else toast('⚠️','קוד לא תקין','5 תווים')}})}
async function roomOpen(code,host,coop){netLeave();NET={code,host,coop,X:null,players:[{id:P.id,name:P.name,av:P.av}],seen:{},started:false,last:Date.now()};
 roomRender();try{NET.X=await transport(code)}catch(e){toast('📡','אין חיבור','נסה שוב בעוד רגע');netLeave();home();return}
 NET.X.on(onNet);netSend({t:'hi',name:P.name,av:P.av});
 NET.hb=setInterval(()=>{if(!NET)return;netSend({t:'hb'});const now=Date.now();
  if(NET.host){if(T&&T.G&&T.mode==='online'){T.G.seats.forEach(s=>{if(s.id!==P.id&&now-(NET.seen[s.id]||0)>25000&&!s.away){s.away=true;s.ready=false;T.G.seq++}});broadcast()}else roomBroadcast()}
  else if(now-NET.last>30000){toast('📡','המארח נעלם','השולחן נסגר');netLeave();if(T)tableClose();home()}},2000)}
function roomHost(coop){const code=roomCode();roomOpen(code,true,coop)}
function roomJoin(code){roomOpen(code,false,true)}
function roomBroadcast(){if(NET&&NET.host)netSend({t:'room',players:NET.players,coop:NET.coop,started:NET.started})}
function roomRender(){if(!NET||NET.started)return;SCR='room';const url=SHARE_BASE+'#r-'+NET.code;
 const bg=sheet(`<h2>${NET.host?(NET.coop?'🤝 שולחן ביחד':'⚔️ שולחן תחרות'):'נכנסת לשולחן'}</h2>${NET.host?`<p>שלח לחברים את הקישור או את הקוד:</p><div class="code">${NET.code.toUpperCase()}</div><div class="url">${url}</div>
   <button class="btn blue" data-x="share" type="button">📤 שתף קישור</button>`:'<p>מחכים שהמארח יתחיל...</p>'}
  <div class="room">${NET.players.map(p=>`<div><i>${esc(p.av)}</i>${esc(p.name)}${p.id===P.id?' (אתה)':''}<small>${p.id===NET.players[0].id?'👑 מארח':'✓'}</small></div>`).join('')}${NET.players.length<4?'<div style="opacity:.5"><i>⏳</i>מחכה לשחקן...</div>':''}</div>
  ${NET.host?`<button class="btn green" data-x="start" type="button" ${NET.players.length<2&&!NET.coop?'disabled':''}>▶ התחל (${NET.players.length}/4)</button>`:''}<button class="btn alt" data-x="leave" type="button">יציאה</button>`,x=>{
  if(x==='share'){const t=`🃏 בוא לשחק איתי בלאק ג׳ק בש״ג! ${NET.coop?'ביחד מול הדילר':'תחרות 10 ידיים'}\n${url}`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('📋','הקישור הועתק','שלח לחברים'),()=>{})}
  if(x==='leave'){netSend({t:'bye'});netLeave();home()}if(x==='start'&&NET.host)onlineStart()})}
function onNet(m){if(!NET||!m||m.from===P.id)return;NET.last=Date.now();NET.seen[m.from]=Date.now();
 if(m.t==='hi'&&NET.host){if(!NET.players.find(p=>p.id===m.from)){if(NET.players.length>=4)return;NET.players.push({id:m.from,name:String(m.name||'שחקן').slice(0,16),av:String(m.av||'🙂').slice(0,4)});SFX.ding();toast(m.av||'🙂',(m.name||'שחקן')+' הצטרף!','')}
  if(NET.started&&T&&T.G){const G=T.G;let s=G.seats.find(x=>x.id===m.from);if(!s&&NET.coop&&G.seats.length<4){G.seats.push({id:m.from,name:String(m.name||'שחקן').slice(0,16),av:String(m.av||'🙂').slice(0,4),chips:1000,bet:0,pp:0,t3:0,last:0,hands:[],ins:0,insQ:false,ready:false,net:0,side:[],away:false});G.seq++}
   else if(s){s.away=false;s.idle=0}netSend({t:'go',coop:NET.coop});broadcast();render()}else{roomBroadcast();roomRender()}return}
 if(m.t==='room'&&!NET.host){NET.players=m.players||[];NET.coop=m.coop;if(!NET.started)roomRender();return}
 if(m.t==='go'&&!NET.host){if(!NET.started){NET.started=true;NET.coop=m.coop;onlineStart()}return}
 if(m.t==='st'&&!NET.host){if(!T||T.mode!=='online'){NET.started=true;NET.coop=m.s&&m.s.coop;onlineStart()}if(!m.s||(T.G&&m.s.seq<=T.G.seq))return;T.G=m.s;if(m.s.dl&&m.s.dl!==T.dealer){T.dealer=m.s.dl}const mi=T.G.seats.findIndex(s=>s.id===P.id);if(mi<0)return;T.me=mi;T.tEnd=Date.now()+(+m.tl||0);T.coop=m.s.coop;render();return}
 if(m.t==='act'&&NET.host&&T&&T.G){const i=T.G.seats.findIndex(s=>s.id===m.from);if(i>=0){T.G.seats[i].idle=0;apply(i,String(m.a||''),m.v)}return}
 if(m.t==='emo'&&T&&T.G){const i=T.G.seats.findIndex(s=>s.id===m.from);showEmo(i,String(m.e||'').slice(0,4));return}
 if(m.t==='bye'){if(NET.host){NET.players=NET.players.filter(p=>p.id!==m.from);if(T&&T.G){const s=T.G.seats.find(x=>x.id===m.from);if(s){s.away=true;s.ready=false;T.G.seq++;if(T.G.phase==='play'&&T.G.seats[T.G.turn[0]]===s)gAct(T.G,T.G.turn[0],'stand');after()}}else roomRender()}
  else if(m.from===(NET.players[0]&&NET.players[0].id)){toast('🚪','המארח עזב','השולחן נסגר');netLeave();if(T)tableClose();home()}}}
function showEmo(i,e){const s=$(`[data-seat="${i}"]`)||$('.seats');if(!s)return;const d=document.createElement('div');d.className='emo';d.textContent=e;const f=$('.felt'),r=s.getBoundingClientRect(),fr=f.getBoundingClientRect();d.style.left=(r.left-fr.left+r.width/2-17)+'px';d.style.top=(r.top-fr.top-10)+'px';f.appendChild(d);setTimeout(()=>d.remove(),2300);SFX.tick()}
const pub=G=>Object.assign({},G,{shoe:null,left:G.shoe.length,dealer:G.hole?[G.dealer[0],-1]:G.dealer.slice()});
function broadcast(){if(!T||!T.G||T.mode!=='online'||!T.host)return;netSend({t:'st',s:pub(T.G),tl:Math.max(0,T.tEnd-Date.now())})}
function onlineStart(){if(!NET)return;closeSheet();NET.started=true;
 if(NET.host){netSend({t:'go',coop:NET.coop});const G=gNew(NET.players.map(p=>({id:p.id,name:p.name,av:p.av,chips:1000,bet:25})),{min:10,max:500,mode:'online',rounds:NET.coop?0:10});G.coop=NET.coop;G.dl=P.dealer;
  T={G,mode:'online',host:true,me:0,cnt:{},streak:0,bet:25,pp:0,t3:0,bub:'',coop:NET.coop,dealer:P.dealer,tEnd:0,tb:{chips:[10,25,100,500],min:10}};tableMount();say('deal');push()}
 else{T={G:null,mode:'online',host:false,me:0,cnt:{},streak:0,bet:25,pp:0,t3:0,bub:'',coop:NET.coop,dealer:'shoshi',tEnd:0,tb:{chips:[10,25,100,500],min:10}};tableMount();render()}}
function onlineEnd(){if(!T||T.ended)return;T.ended=true;const G=T.G,myI=T.me,sorted=G.seats.map((s,i)=>({s,i})).sort((a,b)=>b.s.chips-a.s.chips),meS=G.seats[T.me],place=sorted.findIndex(x=>x.i===T.me)+1;
 const win=place===1&&sorted.length>1&&sorted[0].s.chips>(sorted[1]?sorted[1].s.chips:0);const reward=win?500:100;addChips(reward);addXP(win?60:25);
 setTimeout(()=>{tableClose();netLeave();SCR='home';home();sheet(`<h2>${win?'🏆 ניצחת את השולחן!':`מקום ${place}`}</h2><div class="lb">${sorted.map((x,k)=>`<div class="${x.i===myI?'me':''}"><span>${k+1}</span><span>${esc(x.s.av||'')} ${esc(x.s.name)}</span><span>${fmt(x.s.chips)}</span></div>`).join('')}</div>
  <p>+${fmt(reward)} צ׳יפים לקופה האמיתית</p><button class="btn" data-x="again" type="button">👥 עוד שולחן</button><button class="btn alt" data-x="close" type="button">לתפריט</button>`,x=>{if(x==='again')friendsScr()});if(win){SFX.bj();confetti(document.body,60)}},1800)}
/* deep link */
function checkHash(){const h=(location.hash||'').match(/^#r-([a-z0-9]{5})$/);if(!h||!ONLINE)return false;history.replaceState(null,'',location.pathname+location.search);
 if(!P.name){P.seen=true;save();nameScr(true);const iv=setInterval(()=>{if(P.name){clearInterval(iv);roomJoin(h[1])}},400);return true}roomJoin(h[1]);return true}
window.addEventListener('hashchange',checkHash);
document.addEventListener('pointerdown',firstTouch,{once:true});
window.addEventListener('pagehide',()=>{if(repDirty)report();if(NET)netSend({t:'bye'})});
home();checkHash();
window.__bj={P,getT:()=>T,getNET:()=>NET,home,soloStart:i=>soloStart(TABLES[i||0]),tourStart,ev,missions,TABLES,gNew,gDeal};
})();
</script>
