const GAME_URL='https://king-of-the-gimelets.vercel.app';
const SHARE_TXT='בוא נראה מי מלך הגימלים של הבסיס 👑 יש לך סיכוי?';
function shareGame(){track('share_game');const txt=SHARE_TXT+'\n'+GAME_URL;
 if(navigator.share){navigator.share({title:'מלך הגימלים',text:txt}).catch(()=>{});return}
 const ov=$('#overlay');ov.hidden=false;
 ov.innerHTML=`<div class="sheet"><h2>שלח לחבר׳ה</h2><p class="copytext" id="shTxt"></p>
  <div class="cardbtns"><a class="big green wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">וואטסאפ</a><button class="big" id="shCopy" type="button">העתק</button></div>
  <button class="ghostbtn" id="shBack" type="button">חזרה</button></div>`;
 $('#shTxt').textContent=txt;
 $('#shCopy').addEventListener('click',e=>{try{navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='הועתק'},()=>selectText($('#shTxt')))}catch(err){selectText($('#shTxt'))}});
 $('#shBack').addEventListener('click',showStart)}

/* ---- progress sheet: missions, rank, achievements ---- */
function showProgress(){const ov=$('#overlay');ov.hidden=false;const career=store.get('gm_career',0);
 ov.innerHTML=`<div class="sheet"><h2>התקדמות</h2>${missionsBlock()}${careerBlock(career)}${achGrid()}<button class="ghostbtn albtn" id="prAl" type="button">📖 אלבום המשפטים · ${albumSet().size}/${LINES.length}</button><button class="ghostbtn" id="prPk" type="button">🃏 פוקר בש״ג</button><button class="ghostbtn" id="prBg" type="button">🎲 שש בש עם שלומי (אימון)</button><button class="ghostbtn" id="prTut" type="button">לעשות טירונות שוב</button><button class="big" id="prBack" type="button">חזרה</button></div>`;
 $('#prTut').addEventListener('click',()=>showTutorialIntro());
 $('#prBg').addEventListener('click',showBgPractice);
 $('#prAl').addEventListener('click',showAlbum);
 $('#prPk').addEventListener('click',showPkLobby);
 $('#prBack').addEventListener('click',showStart)}

/* ---- title screen ---- */
let pickIdx=-1;
let splashSeen=false;
function showSplash(){splashSeen=true;const ov=$('#overlay');ov.hidden=false;
 const rain=Array.from({length:14},(_,i)=>`<i style="left:${(i*7.3+3)%100}%;animation-delay:${(i*.9)%7}s;animation-duration:${7+(i%5)}s">ג׳</i>`).join('');
 ov.innerHTML=`<div class="ts splash" id="spl"><div class="ts-rain" aria-hidden="true">${rain}</div>
  <div class="ts-hero"><div class="ts-kicker">מרפאת גדוד · תור 06:58</div><h1 class="ts-title"><span class="ts-small">מלך</span><span class="ts-big">הגימלים</span></h1><div class="ts-stamp" aria-hidden="true">אושר</div>
   <p class="ts-sub">תשכנע את הרופא לתת לך ימי גימלים. בלי לחטוף שמירה.</p></div>
  <div class="spl-duo">${portrait('tiron')}<span>נגד</span><div class="spl-doc">🩺</div></div>
  <button class="big cta splcta" id="splGo" type="button">▶ שחק עכשיו</button>
  <p class="spl-note">30 שניות ואתה בפנים · בלי הרשמה</p>
  <button type="button" class="ghostbtn" id="splMenu">לתפריט המלא</button></div>`;
 const go=()=>{ac();SFX.tick();track('title_cta');track('splash_go');startTutorial()};
 $('#splGo').addEventListener('click',e=>{e.stopPropagation();go()});
 $('#spl').addEventListener('click',e=>{if(e.target.closest('#splMenu'))return;go()});
 $('#splMenu').addEventListener('click',e=>{e.stopPropagation();SFX.tick();showStart()});musicPlay('menu')}
function showStart(){
 if(!splashSeen&&isNewbie()&&!store.get('gm_tutdone',false))return showSplash();
 {const gp=$('#goalPill');if(gp)gp.hidden=true}
 if(!loginShown&&(store.get('gm_tutdone',false)||store.get('gm_played',false))&&loginState().pending)return showLogin(showStart);
 const ov=$('#overlay');ov.hidden=false;const keys=Object.keys(CHARS);pickIdx=keys.indexOf(charId());
 const best=store.get('gm_best3',0),career=store.get('gm_career',0),D=daily();
 const rain=Array.from({length:14},(_,i)=>`<i style="left:${(i*7.3+3)%100}%;animation-delay:${(i*.9)%7}s;animation-duration:${7+(i%5)}s">ג׳</i>`).join('');
 ov.innerHTML=`<div class="ts">
  <div class="ts-rain" aria-hidden="true">${rain}</div>
  <div class="ts-top">${crateReady()?`<button type="button" class="tpill coinpill crateready" id="toCrate">🎁 ארגז מוכן</button>`:`<span class="tpill coinpill">${getCoins()} ${COIN} · ${crateDots()}</span>`}<button type="button" class="tpill profpill" id="toProf">${(cleanName(store.get('gm_name',''))||'הפרופיל שלי').replace(/[<>&"]/g,'')}</button>${ONLINE?`<button type="button" class="tpill basepill" id="toBase">${getBase()?'בסיס '+getBase().replace(/[<>&"]/g,''):'בחר בסיס'}</button>`:`<span class="tpill">${CAREER[careerRank(career)][0]}${best?' · שיא '+best:''}</span>`}</div>
  <div class="season" id="season" hidden></div>
  ${(()=>{const si=streakInfo();return si.n?`<div class="streakbar${si.atRisk&&!si.playedToday?' risk':''}"><span class="flame"></span><b>${si.n} ${si.n===1?'יום':'ימים'} ברצף</b><span>${si.playedToday?'נתראה מחר':'תשחק היום כדי לא לשבור'}</span></div>`:''})()}
  <div class="ts-hero">
   <div class="ts-kicker">מרפאת גדוד · תור 06:58</div>
   <h1 class="ts-title"><span class="ts-small">מלך</span><span class="ts-big">הגימלים</span></h1>
   <div class="ts-stamp" aria-hidden="true">אושר</div>
   <p class="ts-sub">שבוע אחד. רופא אחד. הרבה תירוצים.</p>
   ${titleStage()}
   <div class="ts-live" id="tsLive" hidden><i></i><span></span></div>
  </div>
  <div class="ts-pick">
   <button type="button" class="arr" id="pPrev" aria-label="הדמות הקודמת">›</button>
   <div class="pcard" id="pCard"></div>
   <button type="button" class="arr" id="pNext" aria-label="הדמות הבאה">‹</button>
  </div>
  <div class="pdots" id="pDots">${keys.map((k,i)=>`<i class="${owned().includes(k)?'own':''}"></i>`).join('')}</div>
  <button class="big cta" id="go" type="button">${isNewbie()?'שחק עכשיו':'ריצה חדשה'}</button>
  <button type="button" class="goaltick" id="goalTick" hidden></button>
  <button type="button" class="bjhome" id="goBj"><span class="bjn">21</span><b>בלאק ג׳ק בש״ג</b><span class="bjs">♠ ♥ ♣ ♦</span></button>
  ${ONLINE?`<div class="ts-duo three"><button class="dailybtn" id="goDaily" type="button"><b>אתגר יומי</b><span>${dailyBest()>=0?'שיא היום: '+dailyBest():'+50 '+COIN}</span></button><button class="dailybtn pvpbtn" id="goPvp" type="button"><b>🆚 מול חבר</b><span>אגרוף או שש בש</span></button><button class="dailybtn revbtn2 gamesbtn" id="goGames" type="button"><b>🃏 משחקים</b><span>פוקר ועוד</span></button></div>`
   :`<button class="revbtn gamesbtn" id="goGames" type="button"><b>🃏 משחקים</b><span>פוקר, הרופא המתנקם, שש בש</span></button>`}
  <div class="ts-menu">
   <button type="button" class="tmb" id="toShop"><b>קנטינה</b><span>שדרוגים ודמויות</span></button>
   <button type="button" class="tmb" id="toLB"><b>שיאים</b><span>כל השחקנים</span></button>
   <button type="button" class="tmb" id="toPr"><b>משימות</b><span>${D.done.length}/3 היום</span></button>
  </div>
  <button type="button" class="sharebtn" id="toShare"><b>שלח לחבר׳ה</b><span>מי מלך הגימלים של הבסיס?</span></button>
  ${location.protocol==='file:'?'':'<a class="dl ts-dl" href="https://github.com/shimon77028/King-of-the-Gimelets/releases/latest/download/gimelim.apk" target="_blank" rel="noopener">הורדה לאנדרואיד</a>'}
 </div>`;
 const card=$('#pCard');
 const render=()=>{const k=keys[pickIdx],C=CHARS[k],has=owned().includes(k),sel=charId()===k,can=getCoins()>=C.price;
  card.className='pcard'+(has?'':' locked');
  card.innerHTML=`<div class="pimg">${portrait(k)}${has?'':'<span class="lock">נעול</span>'}</div><div class="pinfo"><b>${C.n}</b><span>${C.d}</span>
   ${has?`<em class="pst">${sel?'משחק בתור '+C.n:''}</em>`:C.excl?`<em class="pst excl">👑 בלעדי: נכנסים 7 ימים ברצף</em>`:`<button type="button" class="buy" id="pBuy" ${can?'':'disabled'}>קנה ב־${C.price} ${COIN}</button><em class="pst">${can?'':'חסרים '+(C.price-getCoins())+' '+COIN+' · '}בינתיים משחק בתור ${CHARS[charId()].n}</em>`}</div>`;
  [...$('#pDots').children].forEach((d,i)=>d.classList.toggle('on',i===pickIdx));
  if(has&&!sel){store.set('gm_char',k);applySoldier();card.querySelector('.pst').textContent='משחק בתור '+C.n}
  
  const b=$('#pBuy');if(b)b.addEventListener('click',()=>{if(getCoins()<C.price)return;addCoins(-C.price);store.set('gm_owned',[...owned(),k]);store.set('gm_char',k);applySoldier();
   SFX.jack();spawn('conf',reduced?6:24,'ג׳');toastMsg('★','דמות חדשה: '+C.n,C.d);showStart()});
  card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap')};
 const step=dlt=>{pickIdx=(pickIdx+dlt+keys.length)%keys.length;SFX.tick();render()};
 $('#pNext').addEventListener('click',()=>step(1));$('#pPrev').addEventListener('click',()=>step(-1));
 let sx=null;card.addEventListener('pointerdown',e=>{sx=e.clientX});card.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)step(dx<0?1:-1)});
 render();
 $('#go').addEventListener('click',()=>{ac();SFX.tick();track('title_cta');startRun()});
 const gp=$('#goPvp');if(gp)gp.addEventListener('click',()=>{ac();SFX.tick();showPvpLobby()});
 $('#goGames').addEventListener('click',()=>{ac();SFX.tick();showGames()});
 $('#goBj').addEventListener('click',()=>{ac();SFX.tick();track('title_bj');showBjLobby()});
 renderGoalTick();setTimeout(checkAlerts,500);
 const gd=$('#goDaily');if(gd)gd.addEventListener('click',()=>{ac();SFX.tick();startRun({mode:'daily'})});
 checkMyDuels();
 $('#toShop').addEventListener('click',()=>{SFX.tick();showShop()});
 $('#toLB').addEventListener('click',()=>{SFX.tick();showLB()});
 $('#toPr').addEventListener('click',()=>{SFX.tick();showProgress()});
 $('#toShare').addEventListener('click',()=>{SFX.tick();shareGame()});
 $('#toProf').addEventListener('click',()=>{SFX.tick();showProfile()});
 const tc=$('#toCrate');if(tc)tc.addEventListener('click',()=>openCrate(showStart));
 const tb=$('#toBase');if(tb)tb.addEventListener('click',()=>{SFX.tick();showBasePicker()});
 fillSeason();musicPlay('menu');
 fillLive();
}

/* ================= mobile, pause, updates ================= */
const VERSION='6.2';
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
let gs=null;
room.addEventListener('pointerdown',e=>{if(S&&S.mode==='fight'&&!e.target.closest('.fly'))gs={x:e.clientX,y:e.clientY}});
room.addEventListener('pointerup',e=>{if(!gs||!S||S.mode!=='fight'){gs=null;return}const dx=e.clientX-gs.x,dy=e.clientY-gs.y;gs=null;
 if(Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy))fightKey(dx<0?'ArrowLeft':'ArrowRight',true);
 else if(dy<-36)fightKey('Enter',true);
 else if(Math.abs(dx)<14&&Math.abs(dy)<14)fightKey('Space',true)});
document.addEventListener('visibilitychange',()=>{if(!S)return;const F=S.F;
 if(S.mode==='fight'&&F&&!F.done&&!F.pvp){if(document.hidden)F.pausedAt=performance.now();else if(F.pausedAt){const d=performance.now()-F.pausedAt;F.start+=d;F.until+=d;F.wStart+=d;F.pausedAt=0}}
 if(S.mode==='talk'&&!S.busy){document.hidden?stopPatience():startPatience()}});
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
 if(j.version&&j.version!==VERSION&&!document.querySelector('.upd')){const b=document.createElement('button');b.type='button';b.className='upd';b.setAttribute('dir','rtl');
  b.textContent='גרסה חדשה של המשחק זמינה · לחיצה לרענון';b.addEventListener('click',()=>location.reload());document.body.appendChild(b)}}catch(e){}}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,300000);
setTimeout(checkDuelHash,600);window.addEventListener('hashchange',checkDuelHash);setTimeout(checkPvpHash,650);window.addEventListener('hashchange',checkPvpHash);

/* ================= wiring ================= */
$('#cashout').addEventListener('click',()=>{if(S&&!S.busy&&!S.over&&S.mode==='talk'&&(S.gimel>0||S.turn>0)){stopPatience();S.busy=true;endVisit('cash')}});
$('#fightBtn').addEventListener('click',startFight);
$('#skillBtn').addEventListener('click',()=>{if(S.busy||S.skill||S.mode!=='talk')return;S.skill=true;S.sus=Math.max(0,S.sus-20);SFX.win();floatTxt('חשד −20');setMood('happy');say('*מגיש שקשוקה חמה*','...עם לחם? אני סולח לך על הכל.',{who:'הרופא'});hud()});
$('#rerollBtn').addEventListener('click',()=>{if(S.busy||S.rerolled||S.mode!=='talk')return;S.rerolled=true;SFX.acamol();say('*מציע לרופא במבה*','...טוב. תתחיל מההתחלה.',{who:'הרופא'});hud();deal()});
const FKEYS={Space:'Space',Enter:'Enter',NumpadEnter:'Enter',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown'};
document.addEventListener('keydown',e=>{if(!S)return;
 if(S.mode==='fight'){const k=FKEYS[e.code];if(k){e.preventDefault();if(!e.repeat)fightKey(k,true)}return}
 const ov=$('#overlay');
 if(!ov.hidden){if(e.key==='Enter'){const b=ov.querySelector('.big:not(:disabled)');if(b){e.preventDefault();b.click()}}return}
 const n=parseInt(e.key,10);
 if(n>=1&&n<=4){const btns=[...document.querySelectorAll('#choices .choice:not(.dim):not(.tut-lock), #choices .retort:not(:disabled)')];if(btns[n-1]){e.preventDefault();btns[n-1].click()}return}
 if(S.mode==='talk'&&!S.busy&&!e.repeat){
  if(e.code==='KeyF'){const b=$('#fightBtn');if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if(e.code==='KeyX'){const b=$('#cashout');if(b&&!b.disabled){e.preventDefault();b.click()}}
  else if(e.code==='KeyR'){const b=$('#rerollBtn');if(b&&!b.hidden&&!b.disabled){e.preventDefault();b.click()}}
  else if(e.code==='KeyM'){$('#mute').click()}}
});
document.addEventListener('keyup',e=>{if(S&&S.mode==='fight'&&e.code==='ArrowDown')fightKey('ArrowDown',false)});
const mb=$('#mute');const syncMute=()=>{mb.textContent='צליל: '+(muted?'כבוי':'פועל')};syncMute();
mb.addEventListener('click',()=>{muted=!muted;store.set('gm_mute',muted);syncMute();if(muted)musicStop();else{SFX.tick();musicResume()}});

S={gimel:0,sus:0,turn:0,turns:6,streak:0,used:new Set(),busy:true,over:false,fought:false,cmdDone:false,mode:'talk',queue:23,evUsed:new Set()};
setMood('neutral');setCmd('yell');hud();deal();showStart();
})();
</script>
