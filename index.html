<title>גימלים במרפאה</title>

<style>
/* Layout: one phone-width column. HUD = patient card, clinic room under flickering fluorescent light, then a console that swaps between lines / events / fight / argument. Single deliberate look: camo field, paper, rubber stamps. */
:root{
  --camo-1:#232a16; --camo-2:#2e3820; --camo-3:#3a4529; --camo-4:#1a200f;
  --paper:#f2e9d0; --paper-2:#ddcfa6; --ink:#22251a; --ink-soft:#5f5c43;
  --khaki:#cdb57a; --stamp:#c3352a; --go:#3c7a2b; --go-2:#8fd45f; --warn:#cf861c; --pill:#2d63a8; --pow:#ffd43b;
  --wall:#cfe0c8; --wall-2:#b8cdae; --desk:#6f4a2c; --desk-2:#4f331d;
  --coat:#fbfaf5; --coat-line:#d9d8cd; --hair:#3b2a1b; --skin:#eab68d; --skin-d:#c98e64;
  --uni:#5b6b3c; --uni-d:#45532d; --beret:#6b2a2a; --night:#12150b;
  --f-display:"Karantina","Rubik","Arial Hebrew",system-ui,sans-serif;
  --f-body:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);color:var(--paper);background-color:var(--camo-1);
  background-image:
    radial-gradient(ellipse 140px 70px at 18% 22%, var(--camo-2) 60%, transparent 62%),
    radial-gradient(ellipse 110px 90px at 72% 30%, var(--camo-3) 58%, transparent 60%),
    radial-gradient(ellipse 160px 60px at 48% 78%, var(--camo-4) 60%, transparent 62%),
    radial-gradient(ellipse 90px 120px at 88% 82%, var(--camo-2) 58%, transparent 60%),
    radial-gradient(ellipse 100px 70px at 8% 70%, var(--camo-3) 58%, transparent 60%);
  background-size:420px 380px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:520px;margin:0 auto;padding-block:14px 32px;display:grid;gap:12px}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--khaki);outline-offset:3px}

/* ---------- HUD ---------- */
.hud{background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 14px 12px;box-shadow:0 2px 0 var(--paper-2),0 10px 24px rgba(0,0,0,.45);position:relative}
.hud::before{content:"";position:absolute;inset:0 0 auto;height:6px;border-radius:5px 5px 0 0;background:repeating-linear-gradient(90deg,var(--stamp) 0 14px,var(--paper) 14px 22px)}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.tag{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
.mute{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;flex:none}
.days{display:flex;gap:4px;margin-top:8px}
.days i{flex:1;height:22px;border:1.5px solid var(--ink);border-radius:2px;font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center;color:var(--ink-soft)}
.days i.done{background:var(--go);border-color:var(--go);color:#fff}
.days i.now{background:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:8px;align-items:end}
.stat{display:grid;gap:2px;min-width:0}
.lbl{font-size:12px;color:var(--ink-soft);font-weight:500}
.num{font-family:var(--f-display);font-size:54px;line-height:.85;font-weight:700;font-variant-numeric:tabular-nums}
.num.small{font-size:38px}
.num .tgt{font-size:24px;color:var(--ink-soft);margin-inline-start:4px}
.num .tgt.hit{color:var(--go)}
.num.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.2);color:var(--go)}}
.streak{display:flex;gap:5px;padding-bottom:8px}
.streak i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.streak i.on{background:var(--stamp);border-color:var(--stamp);box-shadow:0 0 0 3px rgba(195,53,42,.2)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:13px;font-weight:700}
.row2 .late{color:var(--stamp)}
.clock{font-variant-numeric:tabular-nums}
.sus{margin-top:8px}
.sus-lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.sus-lbl span:last-child{font-variant-numeric:tabular-nums}
.meter{height:14px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper-2);overflow:hidden}
.meter > i{display:block;height:100%;width:0;background:var(--go);transition:width .6s cubic-bezier(.3,1.4,.5,1),background .3s}
.meter.hot{animation:throb .7s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 4px rgba(195,53,42,.35)}}
.perks{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.perks span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--ink);color:var(--paper)}

/* ---------- Room ---------- */
.room{position:relative;height:320px;border-radius:5px;overflow:hidden;background:linear-gradient(var(--wall) 0 60%, var(--wall-2) 60%);
  box-shadow:0 10px 24px rgba(0,0,0,.45);transition:filter .4s}
.room::before{content:"";position:absolute;inset:60% 0 0;background-image:linear-gradient(rgba(255,255,255,.35) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.35) 1.5px,transparent 1.5px);background-size:30px 30px}
.room::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 70px rgba(20,30,10,.45);animation:flicker 7s infinite}
@keyframes flicker{0%,91%,100%{background:transparent}92%{background:rgba(10,15,5,.35)}93%{background:transparent}95%{background:rgba(10,15,5,.25)}96%{background:transparent}}
.room.ring::after{animation:ringpulse 1.2s ease-in-out infinite;box-shadow:inset 0 0 90px rgba(195,40,30,.6)}
@keyframes ringpulse{50%{box-shadow:inset 0 0 50px rgba(195,40,30,.35)}}
.room.dark{filter:brightness(.18) contrast(1.3)}
.room.heat{filter:sepia(.45) saturate(1.4) hue-rotate(-12deg)}
.lamp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:9px;background:#f7fbef;border-radius:0 0 4px 4px;box-shadow:0 0 30px 8px rgba(240,255,220,.55);z-index:0}
.chart{position:absolute;top:18px;inset-inline-start:14px;width:62px;background:#fff;color:#111;border:1px solid #aab;padding:6px 3px 4px;text-align:center;font-weight:800;line-height:1.05;box-shadow:0 2px 4px rgba(0,0,0,.2);transform:rotate(2deg)}
.chart div:nth-child(1){font-size:24px}.chart div:nth-child(2){font-size:15px}.chart div:nth-child(3){font-size:11px}
.chart div:nth-child(4){font-size:8px;letter-spacing:1px}.chart div:nth-child(5){font-size:6px;letter-spacing:1px;border-top:1px solid var(--stamp);margin-top:2px;padding-top:2px}
.sign{position:absolute;top:116px;inset-inline-start:12px;background:#fff8e2;color:var(--ink);font-size:10px;font-weight:700;padding:4px 6px;border:1px solid #c9bc93;transform:rotate(-3deg);line-height:1.3}
.sign b{display:block;font-family:var(--f-display);font-size:16px;color:var(--stamp)}
.doc-wrap{position:absolute;bottom:38px;left:50%;width:180px;margin-left:-90px;z-index:1}
.doc svg,.cmd svg{display:block;width:100%;height:auto;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.5,-0.3,.4,1.4)}
.doc .head,.cmd .head{transform-box:view-box;transform-origin:50% 70%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(2px) rotate(-1deg)}}
.doc[data-mood="angry"]{--skin:#ee8c6f;--skin-d:#c8644a}
.doc[data-mood="sick"]{--skin:#bfcf90;--skin-d:#93a56a}
.doc[data-mood="faint"] svg{transform:rotate(-82deg) translate(10px,40px)}
.doc[data-mood="shock"] .head{animation:jolt .3s ease 2}
@keyframes jolt{50%{transform:translateY(-8px)}}
.doc.hit svg{animation:hitjolt .35s ease}
@keyframes hitjolt{30%{transform:translateX(-22px) rotate(-8deg)}70%{transform:translateX(6px)}}
.doc.swing svg{animation:swing .35s ease}
@keyframes swing{40%{transform:translateX(26px) scale(1.1)}}
.off{display:none}
.cmd{position:absolute;bottom:38px;inset-inline-start:-170px;width:132px;z-index:1;transition:inset-inline-start .5s cubic-bezier(.3,1.3,.5,1)}
.cmd.in{inset-inline-start:2px}
.cmd[data-mood="yell"]{--skin:#f09577}
.cmd[data-mood="hurt"] svg{transform:rotate(4deg) scale(.96)}
.desk{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:2;background:linear-gradient(var(--desk) 0 9px,var(--desk-2) 9px);box-shadow:0 -3px 0 rgba(0,0,0,.15)}
.plate{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(#e6c76f,#b8923c);color:#2b1d07;font-size:11px;font-weight:800;padding:3px 10px;border-radius:2px;white-space:nowrap}
.box{position:absolute;bottom:22px;inset-inline-start:22px;width:54px;height:36px;background:#fff;border-radius:2px;box-shadow:2px 2px 0 rgba(0,0,0,.25);overflow:hidden;font-size:10px;font-weight:800;color:var(--pill);text-align:center;line-height:1.1}
.box::before{content:"";display:block;height:9px;background:var(--pill);margin-bottom:3px}
.box small{display:block;font-size:8px;color:#555;font-weight:500}
.papers{position:absolute;bottom:26px;inset-inline-end:40px;width:58px;height:12px;background:#fff;transform:rotate(-6deg);box-shadow:0 -4px 0 #f0ece0,0 -8px 0 #fff,2px 2px 0 rgba(0,0,0,.2)}
.bubble{position:absolute;top:14px;inset-inline-end:12px;max-width:58%;z-index:3;background:#fff;color:var(--ink);border-radius:14px;padding:9px 12px 10px;box-shadow:0 4px 10px rgba(0,0,0,.2);font-size:15px;line-height:1.35}
.bubble::after{content:"";position:absolute;bottom:-10px;inset-inline-start:34px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .me{font-size:12px;color:var(--ink-soft);margin-bottom:4px;padding-bottom:4px;border-bottom:1px dashed #ccc}
.bubble .said{font-weight:700}
.bubble .who{color:var(--stamp)}
.bubble.fresh{animation:bubbleIn .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubbleIn{from{transform:scale(.6);opacity:0}}
.dots span{animation:blink 1s infinite;font-size:22px;line-height:1}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.15}}
.stamp{position:absolute;top:42%;left:50%;z-index:4;font-family:var(--f-display);font-weight:700;font-size:50px;line-height:1;padding:2px 16px 6px;border:5px solid currentColor;border-radius:6px;color:var(--stamp);white-space:nowrap;transform:translate(-50%,-50%) rotate(-12deg);background:rgba(255,255,255,.55);animation:slam .4s cubic-bezier(.2,1.6,.4,1) both}
.stamp.ok{color:var(--go)}.stamp.pill{color:var(--pill)}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}}
.floater{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:5;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:50px;color:#fff;text-shadow:0 3px 0 var(--go),0 6px 14px rgba(0,0,0,.4)}
.floater.go{animation:rise 1.3s ease-out forwards}
.floater.bad{text-shadow:0 3px 0 var(--stamp),0 6px 14px rgba(0,0,0,.4)}
@keyframes rise{0%{transform:translateY(20px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-110px) scale(1);opacity:0}}
.burst{position:absolute;z-index:5;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:58px;line-height:1;color:var(--pow);
  -webkit-text-stroke:3px #1d1a0c;paint-order:stroke fill;text-shadow:4px 4px 0 var(--stamp);animation:burst .8s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes burst{0%{transform:scale(.2) rotate(var(--r));opacity:0}25%{transform:scale(1.15) rotate(var(--r));opacity:1}80%{opacity:1}100%{transform:scale(1) rotate(var(--r));opacity:0}}

/* ---------- Console ---------- */
.prompt{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--khaki);margin:4px 2px -2px;min-height:4px}
.choices{display:grid;gap:10px}
.choice{display:grid;gap:8px;text-align:start;background:var(--paper);color:var(--ink);border:0;border-radius:4px;padding:12px 14px;font-size:17px;font-weight:500;line-height:1.35;box-shadow:0 3px 0 var(--paper-2),0 8px 16px rgba(0,0,0,.4);transition:transform .15s, opacity .25s;animation:dealIn .35s cubic-bezier(.3,1.4,.5,1) both;transform:rotate(var(--tilt))}
.choice:nth-child(1){--tilt:-.6deg}.choice:nth-child(2){--tilt:.5deg;animation-delay:.06s}.choice:nth-child(3){--tilt:-.3deg;animation-delay:.12s}
.choice:hover{transform:rotate(0) translateY(-2px)}
.choice:active{transform:scale(.98)}
.choice em{font-style:italic;color:var(--ink-soft)}
.choice.dim{opacity:.25;pointer-events:none}
.choice.picked{transform:rotate(0) scale(1.02);box-shadow:0 0 0 3px var(--khaki),0 8px 16px rgba(0,0,0,.4);pointer-events:none}
@keyframes dealIn{from{transform:translateY(16px) rotate(var(--tilt,0deg));opacity:0}}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;letter-spacing:.02em}
.chip.r1{background:var(--go)}.chip.r2{background:var(--warn)}.chip.r3{background:var(--stamp)}
.chip.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.actbtn{border:0;border-radius:4px;padding:6px 10px 8px;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.05}
.cashout{background:var(--khaki);color:var(--ink);box-shadow:0 3px 0 #9c8752}
.fightbtn{background:var(--stamp);color:#fff;box-shadow:0 3px 0 #8c2219}
.reroll{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--paper-2)}
.actbtn:disabled{opacity:.4;cursor:not-allowed}
.console{background:var(--ink);color:var(--paper);border-radius:5px;padding:14px;display:grid;gap:12px;box-shadow:0 10px 24px rgba(0,0,0,.5);border:2px solid #3b3f2b;animation:dealIn .3s ease both}
.console.event{background:#2a2414;border-color:var(--warn)}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-size:34px;line-height:1;color:var(--khaki)}
.c-head span{font-family:var(--f-body);font-size:13px;color:var(--paper);opacity:.75}
.c-text{font-size:16px;line-height:1.45;font-weight:500}
.bar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar span:last-child{text-align:end;font-variant-numeric:tabular-nums}
.track{height:14px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;transition:width .35s ease;background:var(--go-2)}
.track i.red{background:var(--stamp)}.track i.amber{background:var(--warn)}
.intent{background:rgba(195,53,42,.18);border:1.5px dashed var(--stamp);border-radius:4px;padding:8px 10px;font-size:14px;line-height:1.4}
.intent.guard{background:rgba(205,181,122,.15);border-color:var(--khaki)}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.moves button{display:grid;gap:2px;text-align:start;background:var(--paper);color:var(--ink);border:0;border-radius:4px;padding:8px 10px;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1;box-shadow:0 3px 0 var(--paper-2)}
.moves button small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--ink-soft)}
.moves button[data-m="kick"]{background:#ffe7c2}.moves button[data-m="block"]{background:#dfe8d2}
.moves button:disabled{opacity:.3}
.timing{position:relative;height:42px;border:2px solid var(--paper);border-radius:4px;background:repeating-linear-gradient(90deg,#33372a 0 10px,#2b2e23 10px 20px);direction:ltr;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(143,212,95,.55);border-inline:2px solid var(--go-2)}
.zone.blockz{background:rgba(120,170,230,.5);border-color:#9cc4f0}
.crit{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);background:var(--go-2)}
.needle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
.punch{width:100%;background:var(--stamp);color:#fff;border:0;border-radius:4px;padding:6px 10px 9px;font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1;box-shadow:0 4px 0 #8c2219;animation:throbBtn .6s ease-in-out infinite}
@keyframes throbBtn{50%{transform:scale(1.02)}}
.hint{font-size:12px;opacity:.75;text-align:center;line-height:1.4}
.retort{display:grid;gap:6px;text-align:start;background:var(--paper);color:var(--ink);border:0;border-radius:4px;padding:10px 12px;font-size:16px;font-weight:500;line-height:1.35;box-shadow:0 3px 0 var(--paper-2)}
.retort:hover{transform:translateY(-2px)}
.retort:disabled{opacity:.3;transform:none}
.opt2{display:grid;gap:10px}

/* ---------- Overlay sheets ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;background:rgba(18,22,10,.88);backdrop-filter:blur(3px);
  padding:max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:5px;padding:22px 22px 20px;position:relative;transform:rotate(-1deg);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:sheetIn .45s cubic-bezier(.3,1.4,.5,1)}
.sheet.court{background:#e9e4d6;transform:rotate(.8deg)}
.sheet.court::before{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(30,30,30,.13) 46px 52px)}
.sheet.intro{background:var(--night);color:var(--paper);transform:none;border:1px solid #3a4128}
.sheet.intro::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
@keyframes sheetIn{from{transform:translateY(40px) rotate(-6deg);opacity:0}}
.sheet h1{font-family:var(--f-display);font-size:96px;line-height:.8;margin:6px 0 0;color:var(--stamp);font-weight:700}
.sheet h1 span{display:block;font-size:44px;color:var(--ink)}
.intro h1{font-size:120px;color:var(--khaki)}
.intro .time{font-family:var(--f-display);font-size:30px;color:var(--stamp);letter-spacing:.04em}
.story{font-size:17px;line-height:1.6;min-height:5.2em;margin:12px 0;position:relative;cursor:pointer}
.story::after{content:"▌";animation:blink 1s infinite;color:var(--khaki)}
.story.done::after{content:""}
.sheet h2{font-family:var(--f-display);font-size:58px;line-height:.9;margin:8px 0 4px;text-wrap:balance}
.sheet p{margin:10px 0;line-height:1.5;font-size:15px;position:relative}
.rules{margin:12px 0 16px;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.4}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.rules b{font-family:var(--f-display);font-size:22px;line-height:.9;color:var(--stamp)}
.rows{display:grid;margin:14px 0;border-top:1.5px solid currentColor;position:relative}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #b5a87f;font-size:15px}
.rows dt{opacity:.75}.rows dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.big{width:100%;background:var(--stamp);color:#fff;border:0;border-radius:4px;padding:6px 12px 9px;font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1;box-shadow:0 4px 0 #8c2219;position:relative}
.big.green{background:var(--go);box-shadow:0 4px 0 #24521a}
.big:disabled{opacity:.4;cursor:not-allowed}
.big:active{transform:translateY(2px)}
.ghostbtn{width:100%;margin-top:10px;background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:4px;padding:8px;font-weight:700;font-size:14px;position:relative}
.defense{width:100%;display:grid;gap:4px;text-align:start;margin-top:8px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;font-size:15px;font-weight:500;position:relative}
.defense.mom{background:#fff3c9;border-color:var(--warn)}
.defense small{font-size:12px;color:var(--ink-soft)}
.perk-h{font-family:var(--f-display);font-size:28px;line-height:1;margin:14px 0 8px}
.perkbox{display:grid;gap:8px;margin-bottom:14px}
.perk{display:grid;gap:3px;text-align:start;background:#fff;color:var(--ink);border:2px solid var(--paper-2);border-radius:4px;padding:9px 12px;position:relative}
.intro .perk{background:#20261a;color:var(--paper);border-color:#3a4128}
.perk b{font-size:16px}.perk span{font-size:13px;opacity:.8;line-height:1.35}
.perk.sel{border-color:var(--go);box-shadow:0 0 0 3px rgba(60,122,43,.3)}
.intro .perk.sel{border-color:var(--go-2)}
.best{font-size:13px;opacity:.75;text-align:center;margin-top:12px}
.career{margin:12px 0;font-size:14px;font-weight:700}
.career .track{background:rgba(0,0,0,.12);margin-top:5px}
.career .track i{background:var(--stamp)}
.end-stamp{position:absolute;top:18px;inset-inline-start:16px;font-family:var(--f-display);font-weight:700;font-size:30px;border:4px solid currentColor;border-radius:5px;padding:0 10px 3px;transform:rotate(14deg);animation:slam .5s .25s cubic-bezier(.2,1.6,.4,1) both}
.end-stamp.ok{color:var(--go)}.end-stamp.no{color:var(--stamp)}
.copytext{font-size:13px;background:#fff;border:1px solid #ccc;padding:6px;user-select:all}

/* ---------- FX ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.pill{position:absolute;top:-40px;width:36px;height:15px;border-radius:8px;border:1px solid #9fb0c4;background:linear-gradient(90deg,#fff 50%,#dfe8f4 50%);animation:fall 1.6s linear forwards}
.conf{position:absolute;top:-40px;width:28px;height:32px;display:grid;place-items:center;background:var(--paper);color:var(--go);font-family:var(--f-display);font-weight:700;font-size:24px;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
.siren{position:absolute;inset:0;animation:siren .36s steps(1) 5}
@keyframes siren{0%{background:radial-gradient(circle at 0 0,rgba(230,30,30,.55),transparent 60%)}50%{background:radial-gradient(circle at 100% 0,rgba(30,90,240,.55),transparent 60%)}}
.gas{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(150,190,40,.55),rgba(120,160,30,.2) 60%,transparent);animation:gas 2.4s ease forwards}
@keyframes gas{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards}
.hurt{position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(200,20,20,.6));animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(40,40,40,.85) 40px 50px);animation:barsdown .6s cubic-bezier(.5,1.6,.5,1) forwards}
@keyframes barsdown{from{transform:translateY(-100%)}}
#app.shake{animation:shake .5s}
@keyframes shake{10%,50%,90%{transform:translateX(-8px)}30%,70%{transform:translateX(8px)}}
/* ---------- Scene extras ---------- */
.window{position:absolute;top:134px;inset-inline-end:14px;width:80px;height:62px;border:4px solid #eef2ea;border-radius:2px;overflow:hidden;
  background:linear-gradient(#8ec5e8,#d8eef7 66%,#a9c789 66%);box-shadow:inset 0 0 0 2px #a9b9a1,0 2px 4px rgba(0,0,0,.15)}
.window::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#f4f6ef 0 3px,transparent 3px 9px);opacity:.8;z-index:1}
.window .sun{position:absolute;top:7px;left:10px;width:16px;height:16px;border-radius:50%;background:#ffe27a;box-shadow:0 0 12px #ffe27a}
.window .flag{position:absolute;bottom:20px;right:14px;width:2px;height:22px;background:#555}
.window .flag::after{content:"";position:absolute;top:0;left:2px;width:14px;height:9px;background:linear-gradient(#fff 0 20%,#2d63a8 20% 32%,#fff 32% 68%,#2d63a8 68% 80%,#fff 80%);animation:wave 1.4s ease-in-out infinite;transform-origin:left}
@keyframes wave{50%{transform:skewY(6deg) scaleX(.9)}}
.wclock{position:absolute;top:24px;inset-inline-start:92px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #2b2f33;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.wclock::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#2b2f33}
.wclock i{position:absolute;left:50%;bottom:50%;width:3px;margin-left:-1.5px;background:#2b2f33;transform-origin:50% 100%;border-radius:2px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.wclock .h{height:10px}.wclock .m{height:15px;width:2px;margin-left:-1px;background:var(--stamp)}
.doc [data-k="eo"]{transform-box:fill-box;transform-origin:center;animation:blinkEye 4.2s infinite}
@keyframes blinkEye{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.soldier{position:absolute;bottom:-8px;inset-inline-end:2px;width:150px;z-index:3;transform-origin:30% 100%;pointer-events:none}
.soldier svg{display:block;width:100%;height:auto}
.soldier .fist{opacity:0}
.soldier.cheer{animation:cheer .6s ease}
@keyframes cheer{30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:none}}
.soldier.slump{animation:slump .8s ease}
@keyframes slump{40%{transform:scale(.95,.88) translateY(8px)}}
.soldier.punch{animation:lunge .4s ease}
.soldier.punch .fist{opacity:1}
@keyframes lunge{40%{transform:translateX(64px) translateY(-14px) rotate(8deg)}}
.soldier.flinch{animation:flinch .45s ease}
@keyframes flinch{30%{transform:translateX(-12px) rotate(-7deg)}}
.cmd .rmus{display:none}
.cmd.rasar{--beret:#262626}
.cmd.rasar .rmus{display:inline}
.cmd.boss{inset-inline-start:calc(50% - 66px);bottom:58px;width:140px}
.gatebar,.booth{display:none}
.room.gate{background:linear-gradient(#93cbe9,#e4f2f6 60%,#8a8e82 60%)}
.room.gate::before{display:none}
.room.gate .cl{display:none}
.room.gate .gatebar,.room.gate .booth{display:block}
.gatebar{position:absolute;bottom:100px;inset-inline-end:0;width:58%;height:14px;z-index:2;background:repeating-linear-gradient(90deg,var(--stamp) 0 22px,#fff 22px 44px);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.25);transform-origin:100% 50%;transition:transform 1s cubic-bezier(.4,1.5,.5,1)}
[dir="rtl"] .gatebar{transform-origin:0 50%}
.gatebar.up{transform:rotate(-72deg)}
.booth{position:absolute;bottom:56px;inset-inline-start:10px;width:88px;height:124px;background:#ded8c2;border:3px solid #8b8470;border-radius:3px}
.booth::before{content:"ש״ג";position:absolute;top:6px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--ink)}
.booth::after{content:"";position:absolute;top:40px;left:10px;right:10px;height:38px;background:#93cbe9;border:2px solid #8b8470}
.timer{height:10px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--warn)}
.toast{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 12px);left:50%;z-index:60;background:var(--ink);color:var(--paper);border:2px solid var(--khaki);border-radius:6px;
  padding:8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.5);animation:toast 3.4s ease forwards;max-width:calc(100% - 32px);font-family:var(--f-body)}
.toast b{display:block;font-family:var(--f-display);font-size:24px;color:var(--khaki);line-height:1}
.toast small{display:block;font-size:12px;opacity:.8}
@keyframes toast{0%{transform:translate(-50%,-90px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-90px);opacity:0}}
.medal{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a0,#c79a2e);border:2px solid #7a5b12;
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#4a3608;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 6px;margin:8px 0 14px}
.ach{display:grid;justify-items:center;gap:4px;text-align:center;font-size:10px;font-weight:700;line-height:1.2}
.ach .medal{width:38px;height:38px}
.ach.locked .medal{background:#d8cfb1;border-color:#b0a684;color:#b0a684;box-shadow:none}
.ach.locked span{opacity:.5}
.ach-h{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:26px;line-height:1;margin-top:12px}
.ach-h span{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--ink-soft)}

.patience{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:12px;font-weight:700;color:var(--khaki)}
.pbar{height:8px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;width:100%;background:var(--go-2)}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1.5px solid var(--ink-soft);border-bottom-width:3px;border-radius:4px;font-size:11px;font-weight:800;color:var(--ink-soft);margin-inline-start:auto}
.opt2{counter-reset:o}
.opt2 .retort{position:relative;padding-inline-end:40px}
.opt2 .retort::after{counter-increment:o;content:counter(o);position:absolute;top:9px;inset-inline-end:10px;font-size:11px;font-weight:800;border:1.5px solid var(--ink-soft);border-bottom-width:3px;border-radius:4px;padding:0 5px;color:var(--ink-soft)}
.fstatus{text-align:center;font-family:var(--f-display);font-size:30px;line-height:1;min-height:30px;color:var(--khaki)}
.fstatus.danger{color:#ff6b5b;animation:blink .3s infinite}
.fstatus.open{color:var(--go-2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pk{display:grid;place-items:center;gap:3px;background:var(--paper);color:var(--ink);border:0;border-radius:6px;padding:10px 4px 8px;font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;
  box-shadow:0 4px 0 var(--paper-2);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .06s,box-shadow .06s}
.pk small{font-family:var(--f-body);font-size:11px;font-weight:500;opacity:.75}
.pk.hit{background:var(--stamp);color:#fff;box-shadow:0 4px 0 #8c2219}
.pk.kick{background:var(--warn);color:#fff;box-shadow:0 4px 0 #8a5a12}
.pk.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pk:disabled{opacity:.35}
.cue{position:absolute;top:22%;left:50%;z-index:5;transform:translateX(-50%);text-align:center;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:104px;line-height:.9;color:#fff;
  -webkit-text-stroke:5px var(--stamp);paint-order:stroke fill;text-shadow:0 0 28px rgba(255,60,40,.85);animation:cuePulse .22s ease-in-out infinite alternate}
.cue small{display:block;font-size:28px;-webkit-text-stroke:3px var(--stamp)}
@keyframes cuePulse{to{transform:translateX(-50%) scale(1.14)}}
.shield{position:absolute;bottom:96px;left:50%;width:118px;height:96px;margin-left:-59px;z-index:2;background:#f7f3e6;border:4px solid #8a7a52;border-radius:4px;
  box-shadow:0 5px 0 rgba(0,0,0,.25);padding:8px 10px;display:grid;gap:7px;align-content:start;color:var(--ink);transform:rotate(-4deg);animation:shieldUp .2s ease-out}
.shield b{font-family:var(--f-display);font-size:22px;line-height:1}
.shield i{display:block;height:4px;background:#cfc6a8;border-radius:2px}
@keyframes shieldUp{from{transform:translateY(40px) rotate(-4deg);opacity:0}}
.room.ring .doc svg{transition:transform .18s ease}
.doc.windup svg{transform:translateX(-16px) rotate(-7deg) scale(1.07)}
.soldier.jab{animation:jab .16s ease}
@keyframes jab{50%{transform:translateX(34px) translateY(-6px)}}
.soldier.dodgeL{animation:dodgeL .45s ease}
@keyframes dodgeL{35%{transform:translateX(-44px) rotate(-10deg)}}
.soldier.dodgeR{animation:dodgeR .45s ease}
@keyframes dodgeR{35%{transform:translateX(44px) rotate(10deg)}}
.soldier.blocking{transform:scale(.9) translateY(10px);transition:transform .1s}
.fly{position:absolute;z-index:5;width:36px;height:30px;margin:-15px 0 0 -18px;padding:0;border:0;background:none;cursor:crosshair;touch-action:manipulation}
.fly svg{width:100%;height:100%;display:block}
.fly .w{transform-box:fill-box;transform-origin:center;animation:flap .05s linear infinite alternate}
@keyframes flap{to{transform:scaleY(.3)}}
.fly.splat{transform:scale(1.5);opacity:0;transition:transform .4s,opacity .4s}

.pk{min-height:66px}
.room.ring{touch-action:none}
body.fighting .hud .days,body.fighting .hud .perks,body.fighting .hud .row2,body.fighting .hud .stats{display:none}
body.fighting #app{gap:8px}
.upd{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);transform:translateX(-50%);z-index:70;background:var(--khaki);color:var(--ink);border:0;border-radius:999px;
  padding:10px 18px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:dealIn .4s ease}
@media (max-width:480px){
  .num{font-size:46px}.num.small{font-size:32px}.num .tgt{font-size:20px}
  .choice{font-size:16px;padding:12px}
  .bubble{font-size:14px;max-width:64%}
  .c-head{font-size:30px}
  .actbtn{font-size:22px}
  .sheet{padding:18px 16px}
  .sheet h1{font-size:80px}.intro h1{font-size:100px}
  .cue{font-size:88px}
}
@media (max-height:780px){
  .room{height:272px}
  .window{top:120px}
}

.doc .dm,.doc .stars{display:none}
.doc.dmg1 .dm1,.doc.dmg2 .dm2,.doc.dmg3 .dm3{display:inline}
.doc.dmg2 .dm1,.doc.dmg3 .dm1,.doc.dmg3 .dm2{display:inline}
.doc.dazed .stars{display:inline;transform-box:view-box;transform-origin:110px 22px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.doc .mirror{transform-box:view-box;transform-origin:110px 44px;transition:transform .7s cubic-bezier(.5,-0.4,.6,1),opacity .7s}
.doc.dmg3 .mirror{transform:translate(40px,150px) rotate(170deg);opacity:0}
.doc.hitL svg{animation:hitL .28s ease}
.doc.hitR svg{animation:hitR .28s ease}
@keyframes hitL{30%{transform:translateX(-20px) rotate(-10deg)}}
@keyframes hitR{30%{transform:translateX(20px) rotate(10deg)}}
.soldier .glv,.soldier .boot{opacity:0;transform-box:fill-box;transform-origin:center;transition:transform .1s ease-out,opacity .15s}
body.fighting .soldier .glv{opacity:1}
.soldier.jabL .gl{transform:translate(132px,-84px) scale(.58);transition-duration:.07s}
.soldier.jabR .gr{transform:translate(92px,-88px) scale(.58);transition-duration:.07s}
.soldier.blocking .gl{transform:translate(28px,-40px)}
.soldier.blocking .gr{transform:translate(-28px,-40px)}
.soldier.kicking .boot{animation:kickUp .38s ease-out}
@keyframes kickUp{0%{opacity:1;transform:translateY(40px)}55%{opacity:1;transform:translate(70px,-80px) scale(.62) rotate(-24deg)}100%{opacity:0;transform:translate(74px,-86px) scale(.6) rotate(-24deg)}}
.dweap{position:absolute;top:24%;width:126px;z-index:4;pointer-events:none;animation:windW .4s ease-in-out infinite alternate}
.dweap.fromL{left:12%}.dweap.fromR{right:12%}
.dweap.fromR svg{transform:scaleX(-1)}
.dweap svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
@keyframes windW{to{transform:translateY(-12px) rotate(-10deg)}}
.dweap.strike{animation:strikeMe .26s ease-in forwards}
@keyframes strikeMe{to{transform:translate(var(--sx),110px) scale(3.4);opacity:.15}}
.dweap.miss{animation:missMe .3s ease-in forwards}
@keyframes missMe{to{transform:translate(var(--mx),50px) rotate(35deg);opacity:0}}
.dweap.back{animation:backW .2s ease-out forwards}
@keyframes backW{to{transform:translateY(-40px) scale(.7);opacity:0}}
.room.impact{animation:impact .16s ease}
@keyframes impact{40%{transform:scale(1.03) translateY(2px)}}
.spark{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--pow);box-shadow:0 0 8px var(--pow);z-index:5;pointer-events:none;animation:spark .36s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.dmgnum{position:absolute;z-index:6;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;color:#fff;-webkit-text-stroke:2px #1d1a0c;paint-order:stroke fill;animation:dmgUp .7s ease-out forwards}
.dmgnum.big{font-size:54px;color:var(--pow)}
@keyframes dmgUp{to{transform:translateY(-54px);opacity:0}}

.choice{grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-size:18px;font-weight:700;border-inline-start:8px solid var(--go)}
.choice.rk2{border-inline-start-color:var(--warn)}.choice.rk3{border-inline-start-color:var(--stamp)}
.choice .kbd{margin:0}
.ctext{display:grid;gap:6px;justify-items:start;min-width:0}
.ctext .chip{font-size:11px;padding:1px 8px}
.cdays{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:700;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.choice.rk3 .cdays{color:var(--stamp)}
.cdays b{color:var(--stamp);margin-inline-start:2px}
.patience{grid-template-columns:1fr}
.pbar{height:6px}
.more{margin-top:12px;font-size:14px}
.more summary{cursor:pointer;font-weight:700;padding:6px 0}
.dl{display:block;text-align:center;margin-top:12px;font-size:14px;font-weight:700;color:var(--ink)}
.rules{font-size:16px}
@media (hover:none){.kbd,.pk small,.opt2 .retort::after{display:none}.opt2 .retort{padding-inline-end:12px}}

.doc .lhair,.doc .stub{display:none}
.doc.d-ronit{--hair:#7a2e1a;--skin:#f1c6a2;--skin-d:#d29c76}
.doc.d-ronit .lhair{display:inline}.doc.d-ronit .mus{display:none}
.doc.d-avi{--hair:#8d8d86}.doc.d-avi .stub{display:inline}
.doc.d-noam{--hair:#c9a14a;--skin:#f3c9a4}.doc.d-noam .glasses,.doc.d-noam .mus{display:none}
.tip{font-size:14px;opacity:.85;margin:4px 0 0}
.missions{display:grid;gap:8px;margin:14px 0}
.missions .ach-h{margin:0}
.mis{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;font-weight:700}
.mis .track{grid-column:1/-1;height:6px;background:rgba(0,0,0,.12)}

.coin3d{position:relative;width:86px;height:86px;transform-style:preserve-3d}
.coin3d > div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;font-family:var(--f-display);font-weight:700;border:4px solid #7a5b12;
  background:radial-gradient(circle at 35% 30%,#fff1b8,#c79a2e);color:#4a3608;font-size:40px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.coin3d .cb{transform:rotateY(180deg);font-size:26px;background:radial-gradient(circle at 35% 30%,#f0b0a8,#a8261c);color:#fff;border-color:#5e130c}
.coin3d.spin-win{animation:spinWin 1.7s cubic-bezier(.2,.7,.3,1) forwards}
.coin3d.spin-lose{animation:spinLose 1.7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spinWin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-60px) rotateY(1080deg)}100%{transform:translateY(0) rotateY(2160deg)}}
@keyframes spinLose{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-60px) rotateY(1080deg)}100%{transform:translateY(0) rotateY(2340deg)}}
.basebox{display:grid;gap:6px;margin:12px 0;padding:12px;border-radius:6px;background:#dfe8d2;border:2px solid var(--ink)}
.basebox b{font-family:var(--f-display);font-size:28px;line-height:1}
.basebox span{font-size:13px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.basepill{cursor:pointer;color:var(--pow);font:inherit;font-size:13px;font-weight:800}
.season{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;font-size:12px;color:var(--paper);background:rgba(0,0,0,.35);border:1.5px solid rgba(255,212,59,.45);border-radius:6px;padding:5px 10px}
.season .sk{color:var(--pow)}.season .sl{opacity:.85}.season .stb{color:var(--pow)}
.crown{width:18px;height:13px;background:#ffd43b;clip-path:polygon(0 100%,0 20%,25% 55%,50% 0,75% 55%,100% 20%,100% 100%)}
.tabs.five{grid-template-columns:repeat(5,1fr);gap:4px}
.tabs.five .tab{font-size:12px;padding:6px 2px}
@media (prefers-reduced-motion: reduce){body.fever .room,body.fever #app,.fbadge,.coin3d{animation:none!important}}

.coach.act{background:#fff;border-color:var(--go)}
.coach.act small{background:var(--go);color:#fff;animation:blink 1s infinite}
.coach .cwho{font-style:normal;font-family:var(--f-display);font-size:22px;line-height:1;color:var(--stamp)}
.coach{max-height:60vh;overflow:auto}
.choice.tut-lock{opacity:.25;pointer-events:none;filter:grayscale(1)}
.tutintro .instr{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin:10px 0}
.tutintro .instr svg{width:96px;height:auto;background:radial-gradient(circle at 50% 60%,#dfe8d2,#c3cfb2);border-radius:50%;border:3px solid var(--ink)}
.tutintro .instr p{margin:0;font-size:15px;font-weight:700;line-height:1.45}
.tutintro .instr b{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px}
.learn{display:grid;gap:8px;margin:12px 0}
.learn div{display:grid;gap:2px;background:#fff;border:2px solid var(--paper-2);border-radius:5px;padding:8px 10px}
.learn b{font-size:15px}.learn span{font-size:13px;color:var(--ink-soft);line-height:1.4}

.doc .eyes{transform-box:view-box;transform-origin:110px 90px;transition:transform .18s}
.doc.look-l .eyes{transform:translateX(-4px)}.doc.look-r .eyes{transform:translateX(4px)}.doc.look-d .eyes{transform:translateY(3px)}
.doc.squint .eyes{transform:scaleY(.45)}
.doc .brows{transform-box:view-box;transform-origin:110px 66px;transition:transform .25s}
.doc.mid-sus .brows{transform:translateY(-4px) rotate(-4deg)}
.doc.hi-sus .brows{transform:translateY(3px) scaleY(1.15)}
.doc .sweat2{display:none}.doc.hi-sus .sweat2{display:inline}
.doc .drop{animation:drip 1.4s ease-in infinite}.doc .d2{animation-delay:.5s}.doc .d3{animation-delay:.95s}

.doc.nod .head{animation:nodA .65s ease}
@keyframes nodA{40%{transform:translateY(6px) rotate(2deg)}}
.cine{position:fixed;inset:0;z-index:70;pointer-events:auto;overflow:hidden}
.cine .door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#6d7a52,#58653f);box-shadow:inset 0 0 0 10px #4a5536;animation:doorOpen .9s .55s cubic-bezier(.6,0,.3,1) forwards}
.cine .dl{left:0;border-right:3px solid #2e3620}.cine .dr{right:0;animation-name:doorOpenR}
.cine .door i{position:absolute;top:16%;left:22%;right:22%;height:24%;background:linear-gradient(#bfd4e6,#8fb0c9);border:6px solid #4a5536;border-radius:4px}
.cine .dl i::after{content:"";position:absolute;right:-30%;top:180%;width:16px;height:46px;border-radius:8px;background:#c9b27a;box-shadow:0 2px 0 #6b5a2e}
.cine .dl b{position:absolute;top:46%;left:50%;transform:translateX(-50%) rotate(-3deg);background:#f2e9d0;color:#c3352a;font-family:var(--f-display);font-size:34px;padding:2px 14px 4px;border:3px solid #c3352a;white-space:nowrap}
@keyframes doorOpen{to{transform:translateX(-102%)}}@keyframes doorOpenR{to{transform:translateX(102%)}}
.cine-cap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18%);display:grid;gap:6px;justify-items:center;text-align:center;z-index:2;animation:capIn .5s both,capOut .4s 1.4s forwards}
.cine-cap b{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--pow);-webkit-text-stroke:2px #1d1a0c;paint-order:stroke fill}
.cine-cap span{font-size:15px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:999px}
@keyframes capIn{from{transform:translateY(-14px);opacity:0}}@keyframes capOut{to{opacity:0}}
.cine.out{opacity:0;transition:opacity .4s}
.room.zoomin{animation:roomZoom 1.8s cubic-bezier(.2,.7,.2,1)}
@keyframes roomZoom{0%{transform:scale(1.35);filter:blur(3px) brightness(.6)}60%{filter:none}100%{transform:none}}
.room.zoomin .doc .head{animation:lookUp 1.4s .7s ease-out both}

.nightfx{display:none;position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 42% 52% at 50% 62%,transparent 0 35%,rgba(4,8,28,.84) 78%),linear-gradient(rgba(20,40,110,.28),rgba(20,40,110,.28))}
.room.night .nightfx{display:block}
.room.night .lamp{opacity:0}
.room.night .window{background:linear-gradient(#0b1530,#1e2b55 66%,#1c2a1a 66%)}
.room.night .window .sun{background:#f4f1d0;box-shadow:0 0 10px #f4f1d0;width:12px;height:12px}
.room.night .bubble{z-index:4}
.ts-stage{position:absolute;left:-16px;right:-16px;bottom:-4px;height:58px;z-index:0;pointer-events:none;overflow:hidden;opacity:.95}
.ts-hero>*:not(.ts-stage):not(.ts-stamp){position:relative;z-index:1}
.ts-stamp{z-index:2}
.ts-hero{padding-bottom:50px}
.ts-stage .sneak{position:absolute;bottom:-4px;right:-70px;width:50px;animation:sneak 11s linear infinite}
.ts-stage .sneak svg{width:100%;height:auto;display:block;animation:tiptoe .5s ease-in-out infinite alternate}
@keyframes tiptoe{to{transform:translateY(-4px) rotate(3deg)}}
@keyframes sneak{0%{right:-70px}45%{right:46%}52%{right:46%;transform:translateY(-16px)}54%{right:46%;transform:none}70%{right:-90px}100%{right:-90px}}
.ts-stage .peek{position:absolute;bottom:-60px;left:18%;width:46px;animation:peek 11s ease-in-out infinite}
.ts-stage .peek svg{width:100%;height:auto;display:block}
.ts-stage .peek b{position:absolute;top:-6px;right:-14px;font-family:var(--f-display);font-size:30px;color:var(--pow);opacity:0;animation:bang 11s infinite}
@keyframes peek{0%,38%{bottom:-60px}44%,62%{bottom:0}68%,100%{bottom:-60px}}
@keyframes bang{0%,46%{opacity:0}48%,60%{opacity:1}62%{opacity:0}}
.ts-stage .pillfly{position:absolute;bottom:22px;left:24%;width:22px;height:10px;border-radius:6px;background:linear-gradient(90deg,#fff 50%,#dfe8f4 50%);opacity:0;animation:pillfly 11s linear infinite}
@keyframes pillfly{0%,48%{opacity:0;transform:none}49%{opacity:1}53%{opacity:1;transform:translateX(130px) translateY(-6px) rotate(380deg)}54%,100%{opacity:0}}
.profpill{cursor:pointer;font:inherit;font-size:13px;font-weight:800;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile .prof-top{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.profile .pimg{width:96px}
.prof-id{display:grid;gap:4px;justify-items:start}
.prof-id input{font:inherit;font-family:var(--f-display);font-size:34px;line-height:1;border:0;border-bottom:2px dashed var(--ink-soft);background:transparent;color:var(--ink);width:100%;padding:0 0 2px}
.prof-rank{font-size:15px;color:var(--stamp)}
.linkbtn{background:none;border:0;padding:0;color:var(--go);font-weight:800;font-size:13px;text-decoration:underline}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.statgrid div{display:grid;justify-items:center;background:#fff;border:2px solid var(--paper-2);border-radius:5px;padding:8px 4px}
.statgrid b{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--go)}
.statgrid span{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center}
@media (prefers-reduced-motion: reduce){.ts-stage{display:none}.room.zoomin,.room.zoomin .doc .head{animation:none}}

function roll(L){const d=RUN.day-1,p={...ODDS[L.r]};if(!L.j){p.w+=p.j;p.j=0}
 if(has('acting')&&L.j){const x=Math.min(p.w,.07);p.w-=x;p.j+=x}
 if(has('thermo')&&L.r<3)p.w+=.12;
 p.w=Math.max(.05,p.w+succMod(L));
 const tough=Math.min(p.w,.035*d);p.w-=tough;p.a+=tough;
 let shift=(S.sus/100)*(.3+.06*d)+(S.hot?.1:0)-(S.scared?.12:0);shift=Math.max(-.2,Math.min(p.w,shift));p.w-=shift;
 const sum=p.w+p.j+p.a;if(sum>.96){const k=.96/sum;p.w*=k;p.j*=k;p.a*=k}
 const x=GR();if(x<p.j)return'jack';if(x<p.j+p.w)return'win';if(x<p.j+p.w+p.a)return'acamol';return'fail'}

 return{name:D.n,banner:'קרב במרפאה',look:fighterLook('doc',S.doc||'shmueli'),max,speed:1,dmg:1,moves:DOC_MOVES,taunts:TAUNTS,pain:DOC_PAIN,who:'הרופא',decisive:false}}
function startFight(cfg){
 cfg=cfg||{};
 if(!cfg.force&&(S.fought||S.busy||S.over||S.mode!=='talk'))return;
 stopPatience();if(!cfg.force)S.fought=true;S.mode='fight';S.busy=true;RUN.fights++;hud();
 const opp=cfg.opp||docOpponent(),now=performance.now(),meMax=100+upLevel('boots')*15+(charId()==='fighter'?30:0);
 S.F={cfg,opp,me:meMax,meMax,doc:opp.max,max:opp.max,st:100,start:now,dur:35000,last:now,phase:'idle',until:now+1400,dir:'L',wStart:0,move:'',feint:false,chain:0,
      cdJab:0,cdPow:0,blocking:false,heal:false,combo:0,dodge:null,raf:0,done:false,pausedAt:0,pow:0};
 if(TUTOR){const F=S.F;F.tut='hold';F.dur=600000;F.doc=F.max=90;F.opp.speed=1.8;F.opp.dmg=.45;setTimeout(()=>tEv('fight'),50)}
 exitFever();setupRing(opp);musicPlay('ring');document.body.classList.add('fighting');SFX.bell();buzz(40);burst(opp.decisive?'הגימל המכריע!':'קרב!');
 try{room.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'})}catch(e){}
 say(cfg.force?null:'*מזמין את '+opp.name+' לקרב*',opp.decisive?pickOne(SOL_TAUNTS):'אתה רציני? טוב. אני מוריד את החלוק.',{who:opp.who});
 setPrompt('');renderFight();S.F.raf=requestAnimationFrame(fightLoop);
}

 updateBars();

 $('#hpMe').style.width=Math.max(0,F.me/F.meMax*100)+'%';$('#hpMeT').textContent=Math.max(0,F.me);
 $('#stMe').style.width=Math.max(0,F.st)+'%';$('#combo').textContent='×'+F.combo;
 $('#hpDoc').style.width=Math.max(0,F.doc/F.max*100)+'%';$('#hpDocT').textContent=Math.max(0,F.doc);
 $('#fOp').classList.toggle('hurt2',F.doc<F.max*.45);$('#fMe').classList.toggle('hurt2',F.me<F.meMax*.4)}

 const a=Math.random()*Math.PI*2,r=rnd(30,80);s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');if(color)s.style.background=color;
 room.appendChild(s);setTimeout(()=>s.remove(),420)}}

/* ---- player input ---- */
function fightKey(k,down){const F=S.F;if(!F||F.done||S.mode!=='fight'||F.pausedAt)return;const now=performance.now(),me=$('#fMe');
 if(k==='ArrowDown'){F.blocking=down;me.classList.toggle('blocking',down);if(down)poseFor(me,'block','block');else poseFor(me,'guard','guard');
  const b=document.querySelector('.pk[data-k="ArrowDown"]');if(b)b.classList.toggle('on',down);return}
 if(!down)return;flashKey(k);
 if(k==='ArrowLeft'||k==='ArrowRight'){F.dodge={dir:k==='ArrowLeft'?'L':'R',at:now};moveFor(me,k==='ArrowLeft'?'m-back':'m-duck',380);SFX.whoosh();return}
 if(F.blocking)return;
 if(k==='ArrowUp'){if(F.heal)return;F.heal=true;F.me=Math.min(F.meMax,F.me+30);F.st=100;floatTxt('+30 חיים');SFX.acamol();spawn('pill',reduced?3:8);$('#healK').disabled=true;updateBars();return}
 if(k==='Space'){if(now<F.cdJab)return;F.cdJab=now+210;attack(rnd(4,7)+(has('gloves')?2:0),'jab');if(F.tut==='hold'){F.tJab=(F.tJab||0)+1;if(F.tJab>=3)tEv('jab3')}return}
 if(k==='Enter'){if(now<F.cdPow)return;F.cdPow=now+820;attack(rnd(15,21)+(has('gloves')?4:0),'power');if(F.tut)tEv('power')}
}
function attack(base,kind){const F=S.F,now=performance.now(),cost=kind==='power'?28:11,me=$('#fMe'),op=$('#fOp');
 if(F.st<cost){status('אין לך אוויר! תנשום','danger');SFX.tick();moveFor(me,'m-duck',200);return}
 F.st-=cost;
 if(kind==='power'){F.pow++;poseFor(me,F.pow%2?'upper':'guard',F.pow%2?'guard':'punch',260)}else poseFor(me,'punch','guard',150);
 moveFor(me,'m-lunge',kind==='power'?260:150);
 let d=Math.round(base*(charId()==='fighter'?1.35:1))+Math.min(Math.floor(F.combo/2),5),note='',blocked=false;
 if(F.phase==='guard'){
  if(kind==='power'){F.phase='stun';F.until=now+900;note='השמירה נשברה!';status('השמירה נשברה! תכה!','open');SFX.big();poseFor(op,'guard','guard');op.classList.add('dazed')}
  else{d=Math.max(1,Math.round(d/4));blocked=true}}
 else if(F.phase==='windup'&&kind==='power'&&Math.random()<.35){F.phase='stun';F.until=now+900;hideCue();poseFor(op,'guard','guard');op.classList.add('dazed');note='קטעת אותו!';status('קטעת אותו! תכה!','open')}
 else if(F.phase==='windup'&&kind==='jab'&&Math.random()<.5){d=Math.max(1,Math.round(d/2))}
 const dbl=F.phase==='exposed'||F.phase==='stun';if(dbl){d*=2;note=note||'כפול!'}
 setTimeout(()=>{if(F.done)return;F.doc-=d;if(TUTOR&&F.tut!=='free'&&F.doc<1)F.doc=1;const p=headPoint('#fOp');
  if(blocked){SFX.block();sparksAt(p,4,'#cfd6da');dmgAt(p,String(d))}
  else{F.combo++;moveFor(op,'m-hit',260);kind==='power'||dbl?SFX.punch():SFX.jab();cls(room,'impact');sparksAt(p,kind==='power'||dbl?12:5);
   dmgAt(p,(dbl?'!':'')+d,kind==='power'||dbl);
   if(kind==='power'||d>=16){burst(pickOne(BURSTS));shake();buzz(20)}
   if(note)floatTxt(note);if(F.combo>=6&&F.combo%3===0)status('קומבו '+F.combo+'!','open');
   if(Math.random()<.14)say(null,pickOne(F.opp.pain),{who:F.opp.who})}
  updateBars();if(F.doc<=0)fightWin()},kind==='power'?140:70);
}

/* ---- opponent AI ---- */
function fightLoop(now){const F=S.F;if(!F||F.done)return;
 if(F.pausedAt){F.last=now;F.raf=requestAnimationFrame(fightLoop);return}
 const dt=Math.min(.05,(now-F.last)/1000);F.last=now;
 F.st=Math.min(100,F.st+(F.blocking?9:25)*dt);const sm=$('#stMe');if(sm){sm.style.width=F.st+'%';sm.classList.toggle('red',F.st<25)}
 const left=Math.max(0,F.dur-(now-F.start)),te=$('#fTime');if(te){te.textContent=Math.ceil(left/1000);te.style.color=left<8000?'#ff6b5b':''}
 if(left<=0)return fightTimeout();
 const rage=F.doc<F.max*.35,op=$('#fOp');
 if(F.tut==='hold'||F.tut==='after'){F.raf=requestAnimationFrame(fightLoop);return}
 if(F.tut==='dodge'&&F.phase!=='windup'){op.classList.remove('dazed');F.phase='windup';F.dir='L';F.wStart=now;F.until=now+2800;F.feint=false;F.move='ישר לפנים';
  showCue(F.dir);poseFor(op,'guard','cock');op.classList.add('windup');status('ישר לפנים!','danger');SFX.warn();F.tut='dodging';tEv('windup');F.raf=requestAnimationFrame(fightLoop);return}
 if(now>=F.until){
  if(F.phase==='windup')strike(now,rage);
  else{
   op.classList.remove('dazed');
   const r=F.chain>0?0:Math.random();
   if(r<.64){
    const W=Math.max(300,(760-RUN.day*55-(rage?170:0))*(F.opp.speed||1))*(F.chain>0?.6:1);
    if(F.chain>0)F.chain--;
    F.phase='windup';F.dir=Math.random()<.5?'L':'R';F.wStart=now;F.until=now+W;F.feint=F.chain===0&&Math.random()<.2;F.move=pickOne(F.opp.moves);
    showCue(F.dir);poseFor(op,'guard','cock');op.classList.add('windup');status(F.move+'!','danger');SFX.warn()}
   else if(r<.86){F.phase='guard';F.until=now+rnd(1000,1800);poseFor(op,'block','block');status('הוא בשמירה · אפרקאט שובר!')}
   else{F.phase='idle';F.until=now+600;status(pickOne(F.opp.taunts));moveFor(op,'m-win',500)}
  }
 }
 F.raf=requestAnimationFrame(fightLoop);
}
function strike(now,rage){const F=S.F,op=$('#fOp'),me=$('#fMe');hideCue();op.classList.remove('windup');
 const dodged=F.dodge&&F.dodge.at>=F.wStart;
 if(F.feint){poseFor(op,'guard','guard');status('הטעיה!');say(null,'חח, נבהלת?',{who:F.opp.who});
  if(dodged){F.st=Math.max(0,F.st-15);floatTxt('נפלת בהטעיה · −15 אוויר',true)}
  F.dodge=null;F.phase='idle';F.until=now+rnd(260,520);return}
 poseFor(op,F.dir==='L'?'guard':'upper',F.dir==='L'?'punch':'guard',300);moveFor(op,'m-lunge',300);
 if(dodged&&F.dodge.dir===F.dir){F.phase='exposed';F.until=now+1150;burst('התחמקת!');SFX.whoosh();op.classList.add('dazed');
  status('הוא פתוח! תכה עכשיו!','open');F.dodge=null;if(rage&&Math.random()<.4)F.chain=1;if(F.tut==='dodging'){F.tut='after';tEv('dodged','ok')}return}
 let dmg=Math.round((16+RUN.day*3+(rage?5:0))*(F.opp.dmg||1)),note='';
 if(dodged)note=' · לצד הלא נכון';
 const p=headPoint('#fMe');
 if(F.blocking){dmg=Math.round(dmg*.3);note=' · נחסם';SFX.block();sparksAt(p,5,'#cfd6da')}
 else{SFX.slap();overlayFx('hurt',450);shake();moveFor(me,'m-hit',300);sparksAt(p,6,'#ff7a5c')}
 F.me-=dmg;if(TUTOR&&F.me<1)F.me=1;if(F.tut==='dodging'){F.tut='after';setTimeout(()=>tEv('dodged','hit'),300)}F.combo=0;F.dodge=null;buzz(F.blocking?25:70);dmgAt(p,'−'+dmg,false,true);
 status(F.move+note,'danger');updateBars();
 if(F.me<=0)return fightLose();
 F.phase='idle';
 if(F.chain<=0&&rage&&Math.random()<.45){F.chain=rnd(1,2);F.until=now+220;status('קומבו שלו!','danger')}

function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){let D=store.get('gm_daily',null);const k=todayKey();
 if(!D||D.date!==k){let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;const keys=Object.keys(MISSIONS),ids=[];
  while(ids.length<3){h=(h*1103515245+12345)>>>0;const id=keys[h%keys.length];if(!ids.includes(id))ids.push(id)}
  D={date:k,ids,prog:{},done:[]};store.set('gm_daily',D)}
 return D}
function mission(id,val=1,mode){const D=daily();if(!D.ids.includes(id)||D.done.includes(id))return;const M=MISSIONS[id];
 D.prog[id]=mode==='max'?Math.max(D.prog[id]||0,val):(D.prog[id]||0)+val;
 if(D.prog[id]>=M.n){D.done.push(id);addCoins(M.r);toastMsg(COIN,'משימה הושלמה! +'+M.r+' '+COIN,M.t);

 store.set('gm_daily',D)}

 $('#go').addEventListener('click',()=>{ac();SFX.tick();track('title_cta');startRun()});
 const gd=$('#goDaily');if(gd)gd.addEventListener('click',()=>{ac();SFX.tick();startRun({mode:'daily'})});
 checkMyDuels();
 $('#toShop').addEventListener('click',()=>{SFX.tick();showShop()});
 $('#toLB').addEventListener('click',()=>{SFX.tick();showLB()});
 $('#toPr').addEventListener('click',()=>{SFX.tick();showProgress()});
 $('#toShare').addEventListener('click',()=>{SFX.tick();shareGame()});
 $('#toProf').addEventListener('click',()=>{SFX.tick();showProfile()});
 const tb=$('#toBase');if(tb)tb.addEventListener('click',()=>{SFX.tick();showBasePicker()});
 fillSeason();musicPlay('menu');
 fillLive();
}

/* ================= mobile, pause, updates ================= */
const VERSION='4.2';
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
let gs=null;
room.addEventListener('pointerdown',e=>{if(S&&S.mode==='fight'&&!e.target.closest('.fly'))gs={x:e.clientX,y:e.clientY}});
room.addEventListener('pointerup',e=>{if(!gs||!S||S.mode!=='fight'){gs=null;return}const dx=e.clientX-gs.x,dy=e.clientY-gs.y;gs=null;
 if(Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy))fightKey(dx<0?'ArrowLeft':'ArrowRight',true);
 else if(dy<-36)fightKey('Enter',true);
 else if(Math.abs(dx)<14&&Math.abs(dy)<14)fightKey('Space',true)});
document.addEventListener('visibilitychange',()=>{if(!S)return;const F=S.F;
 if(S.mode==='fight'&&F&&!F.done){if(document.hidden)F.pausedAt=performance.now();else if(F.pausedAt){const d=performance.now()-F.pausedAt;F.start+=d;F.until+=d;F.wStart+=d;F.pausedAt=0}}
 if(S.mode==='talk'&&!S.busy){document.hidden?stopPatience():startPatience()}});
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
 if(j.version&&j.version!==VERSION&&!document.querySelector('.upd')){const b=document.createElement('button');b.type='button';b.className='upd';b.setAttribute('dir','rtl');
  b.textContent='גרסה חדשה של המשחק זמינה · לחיצה לרענון';b.addEventListener('click',()=>location.reload());document.body.appendChild(b)}}catch(e){}}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,300000);
setTimeout(checkDuelHash,600);window.addEventListener('hashchange',checkDuelHash);

/* ================= wiring ================= */
$('#cashout').addEventListener('click',()=>{if(S&&!S.busy&&!S.over&&S.mode==='talk'&&(S.gimel>0||S.turn>0)){stopPatience();S.busy=true;endVisit('cash')}});
$('#fightBtn').addEventListener('click',startFight);
$('#skillBtn').addEventListener('click',()=>{if(S.busy||S.skill||S.mode!=='talk')return;S.skill=true;S.sus=Math.max(0,S.sus-20);SFX.win();floatTxt('חשד −20');setMood('happy');say('*מגיש שקשוקה חמה*','...עם לחם? אני סולח לך על הכל.',{who:'הרופא'});hud()});
$('#rerollBtn').addEventListener('click',()=>{if(S.busy||S.rerolled||S.mode!=='talk')return;S.rerolled=true;SFX.acamol();say('*מציע לרופא במבה*','...טוב. תתחיל מההתחלה.',{who:'הרופא'});hud();deal()});
const FKEYS={Space:'Space',Enter:'Enter',NumpadEnter:'Enter',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown'};
document.addEventListener('keydown',e=>{if(!S)return;
 if(S.mode==='fight'){const k=FKEYS[e.code];if(k){e.preventDefault();if(!e.repeat)fightKey(k,true)}return}
 const ov=$('#overlay');
 if(!ov.hidden){if(e.key==='Enter'){const b=ov.querySelector('.big:not(:disabled)');if(b){e.preventDefault();b.click()}}return}
 const n=parseInt(e.key,10);
 if(n>=1&&n<=4){const btns=[...document.querySelectorAll('#choices .choice:not(.dim), #choices .retort:not(:disabled)')];if(btns[n-1]){e.preventDefault();btns[n-1].click()}}
});
document.addEventListener('keyup',e=>{if(S&&S.mode==='fight'&&e.code==='ArrowDown')fightKey('ArrowDown',false)});
const mb=$('#mute');const syncMute=()=>{mb.textContent='צליל: '+(muted?'כבוי':'פועל')};syncMute();
mb.addEventListener('click',()=>{muted=!muted;store.set('gm_mute',muted);syncMute();if(muted)musicStop();else{SFX.tick();musicResume()}});

S={gimel:0,sus:0,turn:0,turns:6,streak:0,used:new Set(),busy:true,over:false,fought:false,cmdDone:false,mode:'talk',queue:23,evUsed:new Set()};
setMood('neutral');setCmd('yell');hud();deal();showStart();
})();
</script>
