const patMul=()=>(DOC().mod.pat||1)*(MOOD().pat||1)*(charId()==='jobnik'?1.35:1);
function startSus(d){return Math.max(0,SUS0[d-1]-(has('candy')?10:0)-upLevel('connect')*5-(charId()==='jobnik'?10:0)+(charId()==='fighter'?8:0))}
function lineAvailable(L){return !L.c||L.c===charId()||(L.c==='vip'&&upLevel('vip')>0)}
function pickVisit(d){const dk=d===1?'shmueli':pickOne(Object.keys(DOCS));return{doc:dk,mood:pickOne(Object.keys(DMOODS))}}
function applySoldier(){const c=CHARS[charId()],s=$('#soldier');s.style.setProperty('--s-shirt',c.shirt);s.style.setProperty('--s-beret',c.beret);s.style.setProperty('--s-hair',c.hair);s.dataset.char=charId()}
function applyDoctor(){const D=DOC();const d=$('#doc');D.cls.split(' ').filter(Boolean).forEach(c=>d.classList.add(c));
 const pl=document.querySelector('.plate');if(pl)pl.textContent=D.n+' · '+D.role}

LINES.push(...EXTRA_LINES);

/* ---- daily missions ---- */
const MISSIONS={
 ko:{t:'נצח את הרופא במכות',n:1,r:80},jack:{t:'קבל ג׳קפוט',n:1,r:60},clean:{t:'ביקור בלי כישלון ובלי אקמול',n:1,r:70},
 g10:{t:'צבור 10 ימים בריצה אחת',n:10,r:80},fly:{t:'הרוג 3 זבובים',n:3,r:40},cmd:{t:'נצח את המ״פ בוויכוח',n:1,r:90},
 crazy:{t:'הצלח ב־3 משפטים מטורפים',n:3,r:60},day3:{t:'הגע ליום ג׳',n:1,r:50},streak:{t:'רצף של 3 הצלחות',n:1,r:40},
 gate:{t:'עבור את הש״ג',n:1,r:120},mood:{t:'הצלח 3 פעמים לפי מצב הרוח',n:3,r:60}
};
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){let D=store.get('gm_daily',null);const k=todayKey();
 if(!D||D.date!==k){let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;const keys=Object.keys(MISSIONS),ids=[];
  while(ids.length<3){h=(h*1103515245+12345)>>>0;const id=keys[h%keys.length];if(!ids.includes(id))ids.push(id)}
  D={date:k,ids,prog:{},done:[]};store.set('gm_daily',D)}
 return D}
function mission(id,val=1,mode){const D=daily();if(!D.ids.includes(id)||D.done.includes(id))return;const M=MISSIONS[id];
 D.prog[id]=mode==='max'?Math.max(D.prog[id]||0,val):(D.prog[id]||0)+val;
 if(D.prog[id]>=M.n){D.done.push(id);addCoins(M.r);toastMsg(COIN,'משימה הושלמה! +'+M.r+' '+COIN,M.t);
  if(D.done.length===3){addCoins(100);setTimeout(()=>toastMsg('★','כל המשימות של היום! +100 '+COIN,'בוא מחר לעוד'),3600)}}
 store.set('gm_daily',D)}
function missionsBlock(){const D=daily();
 return `<div class="missions"><div class="ach-h">משימות היום <span>${D.done.length}/3</span></div>`+D.ids.map(id=>{const M=MISSIONS[id],p=Math.min(M.n,D.prog[id]||0),ok=D.done.includes(id);
  return `<div class="mis${ok?' ok':''}"><span class="mt">${M.t}</span><span class="mr">${ok?'✓':'+'+M.r+' '+COIN}</span><div class="track"><i style="width:${p/M.n*100}%"></i></div></div>`}).join('')+'</div>'}
function toastMsg(g,title,sub){const t=document.createElement('div');t.className='toast';t.setAttribute('dir','rtl');
 t.innerHTML=`<span class="medal">${g}</span><span><b></b><small></small></span>`;t.querySelector('b').textContent=title;t.querySelector('small').textContent=sub||'';
 document.body.appendChild(t);setTimeout(()=>t.remove(),3500);[0,.1].forEach((a,i)=>tone([988,1318][i],.2,{type:'triangle',v:.06,at:a+.2}))}

/* ---- canteen (shop) ---- */
function showShop(){const ov=$('#overlay');ov.hidden=false;const own=owned(),cur=charId(),c=getCoins();
 ov.innerHTML=`<div class="sheet shop">
  <div class="shop-top"><h2>קנטינה</h2><span class="coins">${c} ${COIN}</span></div>
  <div class="ach-h">דמויות</div>
  <div class="cards">${Object.entries(CHARS).map(([k,C])=>{const has=own.includes(k);
   return `<div class="card${cur===k?' sel':''}"><span class="sw" style="background:${C.shirt};border-color:${C.beret}"></span><div class="ci"><b>${C.n}</b><span>${C.d}</span></div>
   ${has?`<button type="button" class="buy" data-pick="${k}" ${cur===k?'disabled':''}>${cur===k?'נבחר':'בחר'}</button>`:`<button type="button" class="buy" data-char="${k}" ${c<C.price?'disabled':''}>${C.price} ${COIN}</button>`}</div>`}).join('')}</div>
  <div class="ach-h">שדרוגים</div>
  <div class="cards">${Object.entries(UPGRADES).map(([k,U])=>{const lv=upLevel(k),full=lv>=U.max,pr=U.price[lv];
   return `<div class="card"><span class="lv">${'●'.repeat(lv)}${'○'.repeat(U.max-lv)}</span><div class="ci"><b>${U.n}</b><span>${U.d}</span></div>
   <button type="button" class="buy" data-up="${k}" ${full||c<pr?'disabled':''}>${full?'מקסימום':pr+' '+COIN}</button></div>`}).join('')}</div>
  <button class="big" id="shopBack" type="button">חזרה</button>
  <p class="best">מרוויחים ${COIN} מכל ריצה ומהמשימות היומיות.</p>
 </div>`;
 ov.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{store.set('gm_char',b.dataset.pick);applySoldier();SFX.tick();showShop()}));
 ov.querySelectorAll('[data-char]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.char,C=CHARS[k];if(getCoins()<C.price)return;
  addCoins(-C.price);store.set('gm_owned',[...owned(),k]);store.set('gm_char',k);applySoldier();SFX.jack();toastMsg('★','דמות חדשה: '+C.n,C.d);showShop()}));
 ov.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.up,U=UPGRADES[k],lv=upLevel(k);if(lv>=U.max||getCoins()<U.price[lv])return;
  addCoins(-U.price[lv]);const up=store.get('gm_up',{});up[k]=lv+1;store.set('gm_up',up);SFX.win();showShop()}));
 $('#shopBack').addEventListener('click',showStart);
}

/* ---- leaderboard ---- */
function deviceId(){let id=store.get('gm_id','');if(!id){id=Math.random().toString(36).slice(2,12)+Date.now().toString(36);store.set('gm_id',id)}return id}
let LB=null;
async function lbBackend(){
 if(LB)return LB;
 if(window.claude&&typeof window.claude.use==='function'){
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return null;
  LB={async top(){const q=await db.collection('scores').orderBy('best','desc').limit(15).get();return q.docs.map(d=>{const x=d.data()||{};return{name:x.name,score:x.best,char:x.char}})},
      async submit(name,score,ch){const id=await user.id();if(!id)throw new Error('signed_out');const ref=db.collection('scores').doc(id);const cur=await ref.get();
       const prev=cur.exists?(cur.data().best||0):0;if(score>prev||(cur.exists&&cur.data().name!==name))await ref.set({name,best:Math.max(prev,score),char:ch,at:Date.now()})}};
  return LB}
 const url=location.protocol==='file:'?API_ABS:'/api/scores';
 LB={async top(){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return (await r.json()).scores||[]},
     async submit(name,score,ch){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:deviceId(),name,score,char:ch})});if(!r.ok)throw new Error('http '+r.status)}};
 return LB}
function cleanName(s){return String(s||'').replace(/[<>\u0000-\u001f]/g,'').trim().slice(0,14)}
function renderLB(box,rows){box.innerHTML='';if(!rows.length){box.innerHTML='<p class="best">עוד אין שיאים. תהיה הראשון.</p>';return}
 const me=cleanName(store.get('gm_name',''));
 rows.forEach((r,i)=>{const d=document.createElement('div');d.className='lbrow'+(me&&r.name===me?' me':'');
  d.innerHTML='<span class="rk"></span><span class="nm"></span><span class="ch"></span><span class="sc"></span>';
  d.querySelector('.rk').textContent=i+1;d.querySelector('.nm').textContent=r.name||'חייל';d.querySelector('.ch').textContent=(CHARS[r.char]||{}).n||'';d.querySelector('.sc').textContent=r.score;box.appendChild(d)})}
async function loadLB(box){box.innerHTML='<p class="best">טוען...</p>';
 const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
 try{const be=await Promise.race([lbBackend(),timer]);if(!be)throw new Error('none');renderLB(box,await Promise.race([be.top(),timer]))}
 catch(e){box.innerHTML='<p class="best">טבלת השיאים לא זמינה כרגע.</p>'}}
function showLB(){const ov=$('#overlay');ov.hidden=false;
 ov.innerHTML=`<div class="sheet"><div class="tag">כל השחקנים</div><h2>טבלת שיאים</h2><div class="lb" id="lbBox"></div>
  <button class="big" id="lbBack" type="button">חזרה</button></div>`;
 loadLB($('#lbBox'));$('#lbBack').addEventListener('click',showStart)}
function lbSubmitBlock(g){if(g<1)return'';
 return `<div class="lbsub"><div class="ach-h">טבלת השיאים</div><div class="lbform"><input id="lbName" maxlength="14" placeholder="השם שלך" autocomplete="nickname"><button type="button" class="buy" id="lbSend">שלח ${g}</button></div><p class="best" id="lbMsg"></p><div class="lb" id="lbEnd" hidden></div></div>`}
function wireLBSubmit(g){const inp=$('#lbName');if(!inp)return;inp.value=store.get('gm_name','');
 $('#lbSend').addEventListener('click',async()=>{const name=cleanName(inp.value);const msg=$('#lbMsg');if(!name){msg.textContent='צריך שם.';inp.focus();return}
  store.set('gm_name',name);const btn=$('#lbSend');btn.disabled=true;msg.textContent='שולח...';
  try{const be=await lbBackend();if(!be)throw new Error('none');await be.submit(name,g,charId());msg.textContent='נשלח!';const box=$('#lbEnd');box.hidden=false;loadLB(box)}
  catch(e){msg.textContent='לא הצלחתי לשלוח כרגע.';btn.disabled=false}})}

/* ---- score card ---- */
async function makeCard(o){const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext&&c.getContext('2d');if(!x)return null;
 try{await Promise.all([document.fonts.load('700 100px Karantina'),document.fonts.load('700 40px Rubik')])}catch(e){}
 x.fillStyle='#232a16';x.fillRect(0,0,W,H);
 [['#2e3820',180,220,260,130],['#3a4529',820,300,220,180],['#1a200f',520,1150,320,120],['#2e3820',900,1100,180,240],['#3a4529',140,900,200,140]].forEach(([f,cx,cy,rx,ry])=>{x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fill()});
 x.save();x.translate(W/2,H/2);x.rotate(-.025);x.fillStyle='#f2e9d0';x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=40;x.fillRect(-430,-560,860,1120);x.restore();
 x.fillStyle='#c3352a';for(let i=0;i<20;i++)x.fillRect(110+i*44,148,28,12);
 x.direction='rtl';x.textAlign='center';x.fillStyle='#5f5c43';x.font='700 40px Rubik, Arial';x.fillText('מלך הגימלים · סיכום ריצה',W/2,240);
 x.fillStyle='#22251a';x.font='700 100px Karantina, Rubik, Arial';x.fillText(o.title,W/2,360);
 x.font='700 360px Karantina, Rubik, Arial';x.fillStyle=o.ok?'#3c7a2b':'#c3352a';x.fillText(String(o.g),W/2,690);
 x.fillStyle='#22251a';x.font='700 64px Karantina, Rubik, Arial';x.fillText('ימי גימלים',W/2,770);
 x.font='500 40px Rubik, Arial';x.fillStyle='#5f5c43';
 [['דרגה',o.rank],['דמות',o.char],['ימים שעברת',o.days+' מתוך 5'],['שיא אישי',String(o.best)]].forEach(([k,v],i)=>{const y=860+i*62;
  x.textAlign='right';x.fillStyle='#5f5c43';x.fillText(k,W-180,y);x.textAlign='left';x.fillStyle='#22251a';x.font='700 40px Rubik, Arial';x.fillText(v,180,y);x.font='500 40px Rubik, Arial';
  x.strokeStyle='#b5a87f';x.setLineDash([6,8]);x.beginPath();x.moveTo(180,y+20);x.lineTo(W-180,y+20);x.stroke();x.setLineDash([])});
 x.save();x.translate(W/2,1150);x.rotate(-.12);x.strokeStyle=o.ok?'#3c7a2b':'#c3352a';x.fillStyle=x.strokeStyle;x.lineWidth=10;x.strokeRect(-150,-70,300,120);
 x.textAlign='center';x.font='700 96px Karantina, Rubik, Arial';x.fillText(o.stamp,0,30);x.restore();
 x.textAlign='center';x.fillStyle='#cdb57a';x.font='700 34px Rubik, Arial';x.fillText('נראה אותך · king-of-the-gimelets.vercel.app',W/2,1310);
 return new Promise(r=>c.toBlob(b=>r(b),'image/png'))}
async function showCard(o,back){const ov=$('#overlay');ov.hidden=false;
 ov.innerHTML=`<div class="sheet"><h2>כרטיס תוצאה</h2><div class="cardimg" id="cardImg"><p class="best">מכין...</p></div>
  <div class="cardbtns"><button class="big" id="cardShare" type="button" hidden>שיתוף</button><button class="big green" id="cardSave" type="button" hidden>שמירה</button></div>
  <p class="best" id="cardHint">לחיצה ארוכה על התמונה כדי לשמור.</p><button class="ghostbtn" id="cardBack" type="button">חזרה</button></div>`;
 $('#cardBack').addEventListener('click',back);
 const blob=await makeCard(o);if(!blob){$('#cardImg').innerHTML='<p class="best">לא הצלחתי ליצור תמונה.</p>';return}
 const url=URL.createObjectURL(blob),img=new Image();img.alt='כרטיס תוצאה';img.src=url;$('#cardImg').innerHTML='';$('#cardImg').appendChild(img);
 const file=new File([blob],'gimelim.png',{type:'image/png'}),txt=`הוצאתי ${o.g} ימי גימלים מהקר״פ. נראה אותך.`;
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){const b=$('#cardShare');b.hidden=false;b.addEventListener('click',()=>navigator.share({files:[file],text:txt}).catch(()=>{}))}}catch(e){}
 const sb=$('#cardSave');
 if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(dl=>{if(!dl)return;sb.hidden=false;sb.addEventListener('click',()=>dl.save({filename:'gimelim.png',data:blob}).catch(()=>{}))})}
 else if(location.protocol!=='file:'){sb.hidden=false;sb.addEventListener('click',()=>{const a=document.createElement('a');a.href=url;a.download='gimelim.png';document.body.appendChild(a);a.click();a.remove()})}
}

/* ================= mobile, pause, updates ================= */
const VERSION='2.0';
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
let gs=null;
room.addEventListener('pointerdown',e=>{if(S&&S.mode==='fight'&&!e.target.closest('.fly'))gs={x:e.clientX,y:e.clientY}});
room.addEventListener('pointerup',e=>{if(!gs||!S||S.mode!=='fight'){gs=null;return}const dx=e.clientX-gs.x,dy=e.clientY-gs.y;gs=null;
 if(Math.abs(dx)>36&&Math.abs(dx)>Math.abs(dy))fightKey(dx<0?'ArrowLeft':'ArrowRight',true);
 else if(dy<-36)fightKey('Enter',true);
 else if(Math.abs(dx)<14&&Math.abs(dy)<14)fightKey('Space',true)});
document.addEventListener('visibilitychange',()=>{if(!S)return;const F=S.F;
 if(S.mode==='fight'&&F&&!F.done){if(document.hidden)F.pausedAt=performance.now();else if(F.pausedAt){const d=performance.now()-F.pausedAt;F.start+=d;F.until+=d;F.wStart+=d;F.pausedAt=0}}
 if(S.mode==='talk'&&!S.busy){document.hidden?stopPatience():startPatience()}});
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
 if(j.version&&j.version!==VERSION&&!document.querySelector('.upd')){const b=document.createElement('button');b.type='button';b.className='upd';b.setAttribute('dir','rtl');
  b.textContent='גרסה חדשה של המשחק זמינה · לחיצה לרענון';b.addEventListener('click',()=>location.reload());document.body.appendChild(b)}}catch(e){}}
setTimeout(checkUpdate,4000);setInterval(checkUpdate,300000);

/* ================= wiring ================= */
$('#cashout').addEventListener('click',()=>{if(S&&!S.busy&&!S.over&&S.mode==='talk'&&(S.gimel>0||S.turn>0)){stopPatience();S.busy=true;endVisit('cash')}});
$('#fightBtn').addEventListener('click',startFight);
$('#skillBtn').addEventListener('click',()=>{if(S.busy||S.skill||S.mode!=='talk')return;S.skill=true;S.sus=Math.max(0,S.sus-20);SFX.win();floatTxt('חשד −20');setMood('happy');say('*מגיש שקשוקה חמה*','...עם לחם? אני סולח לך על הכל.',{who:'הרופא'});hud()});
$('#rerollBtn').addEventListener('click',()=>{if(S.busy||S.rerolled||S.mode!=='talk')return;S.rerolled=true;SFX.acamol();say('*מציע לרופא במבה*','...טוב. תתחיל מההתחלה.',{who:'הרופא'});hud();deal()});
const FKEYS={Space:'Space',Enter:'Enter',NumpadEnter:'Enter',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown'};
document.addEventListener('keydown',e=>{if(!S)return;
 if(S.mode==='fight'){const k=FKEYS[e.code];if(k){e.preventDefault();if(!e.repeat)fightKey(k,true)}return}
 const ov=$('#overlay');
 if(!ov.hidden){if(e.key==='Enter'){const b=ov.querySelector('.big:not(:disabled)');if(b){e.preventDefault();b.click()}}return}
 const n=parseInt(e.key,10);
 if(n>=1&&n<=4){const btns=[...document.querySelectorAll('#choices .choice:not(.dim), #choices .retort:not(:disabled)')];if(btns[n-1]){e.preventDefault();btns[n-1].click()}}
});
document.addEventListener('keyup',e=>{if(S&&S.mode==='fight'&&e.code==='ArrowDown')fightKey('ArrowDown',false)});
const mb=$('#mute');const syncMute=()=>{mb.textContent='צליל: '+(muted?'כבוי':'פועל')};syncMute();
mb.addEventListener('click',()=>{muted=!muted;store.set('gm_mute',muted);syncMute();if(!muted)SFX.tick()});

S={gimel:0,sus:0,turn:0,turns:6,streak:0,used:new Set(),busy:true,over:false,fought:false,cmdDone:false,mode:'talk',queue:23,evUsed:new Set()};
setMood('neutral');setCmd('yell');hud();deal();showStart();
})();
</script>
