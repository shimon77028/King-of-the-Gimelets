name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'icon.svg', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy the game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon.svg android/app/src/main/assets/
          echo "GAME_VERSION=$(grep -o '"version":"[^"]*"' version.json | cut -d'"' -f4)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gimelim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gimelim-apk
          path: gimelim.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GAME_VERSION }}-${{ github.run_number }}
          name: מלך הגימלים ${{ env.GAME_VERSION }}
          body: |
            קובץ התקנה לאנדרואיד.
            מורידים את gimelim.apk בטלפון, פותחים, ומאשרים התקנה ממקור לא ידוע.
          files: gimelim.apk
          make_latest: true
